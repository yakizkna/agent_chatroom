<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title data-i18n="title.tab">沟通室 · RA</title>
<link rel="icon" href="/static/images/chatroom-icon.jpg">
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --ink:#e6e8ee;
          --soft:#9aa3b2; --ok:#34d399; --bad:#f87171; --acc:#60a5fa; }
  * { box-sizing: border-box; }
  body { margin:0; padding:28px; background:var(--bg); color:var(--ink);
         font:14px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  h1 { font-size:20px; margin:0 0 38px; display:flex; align-items:center; gap:10px; }
  h1 .roomsel { font-size:13px; vertical-align:2px; margin-left:10px; background:#0b0d12; color:var(--ink);
                border:1px solid var(--line); border-radius:6px; padding:3px 8px; outline:none; }
  h1 .roomsel:focus { border-color:var(--acc); }
  h1 .roomsel:disabled { opacity:.5; }
  .sub { color:var(--soft); font-size:13px; margin-bottom:20px; }
  .sub .mini { margin-left:10px; padding:2px 10px; font-size:12px;
               background:transparent; border:1px solid var(--line); color:var(--soft);
               border-radius:6px; cursor:pointer; text-decoration:none; display:inline-block; }
  .sub .mini:hover { color:var(--ink); border-color:var(--acc); }
  .panel { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .panel input.f  { flex:0 0 130px; min-width:0; }   /* 发件人 */
  .panel input.s  { flex:0 0 130px; min-width:0; }   /* 收件人 */
  .panel input.t  { flex:0 0 150px; min-width:0; }   /* Tag */
  .panel input.xs { flex:0 0 64px; min-width:0; }    /* Re 的编号数字（固定前缀「ReNo」见 .re-prefix）*/
  .panel .re-prefix { flex:0 0 auto; align-self:center; color:#e3b341;
                      font-family:ui-monospace,Menlo,monospace; font-size:13px; user-select:none; }
  .panel .fld { display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; }   /* 每个字段＝固定标签 + 输入框，和 Re: No 同款 */
  .panel .fld.grow { flex:1 1 auto; }                                              /* 主题：占满剩余行宽 */
  .panel .fld.grow input { flex:1 1 auto; min-width:160px; }
  .panel .lbl { flex:0 0 auto; color:#e3b341; font-family:ui-monospace,Menlo,monospace;
                font-size:13px; user-select:none; white-space:nowrap; }
  .panel .row { display:flex; gap:12px; margin-bottom:12px; }
  .panel .row .wide { flex:1; }
  input, textarea#msg { flex:1; background:#0b0d12; color:var(--ink); border:1px solid var(--line);
          border-radius:8px; padding:11px 14px; font-size:13.5px; outline:none; }
  textarea#msg { resize:vertical; height:88px; line-height:1.7; overflow:auto; }
  input:focus, textarea#msg:focus { border-color:var(--acc); }
  button { background:#1f2632; color:var(--ink); border:1px solid var(--line);
           border-radius:8px; padding:10px 18px; cursor:pointer; font-size:13.5px; white-space:nowrap; }
  button:hover { border-color:var(--acc); color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .bar { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .bar .title { font-size:14px; font-weight:600; color:var(--soft); letter-spacing:.5px; }
  .bar .spacer { flex:1; }
  /* 渲染后的 Markdown（CHAT.md 正文）—— 自包含样式，不引外部 CDN */
  .chat { background:#0b0d12; border:1px solid var(--line); border-radius:10px;
          padding:18px 22px; margin:0; min-height:60vh; overflow:auto;
          font-size:13.5px; line-height:1.75; color:#cbd5e1; word-break:break-word; }
  .chat > :first-child { margin-top:0; }
  .chat h2 { font-size:16px; color:var(--ink); margin:22px 0 8px;
             padding-bottom:6px; border-bottom:1px solid var(--line); }
  .chat h3 { font-size:14.5px; color:var(--ink); margin:16px 0 6px; }
  .chat h4, .chat h5, .chat h6 { font-size:13.5px; color:var(--soft); margin:12px 0 4px; }
  .chat p { margin:8px 0; }
  .chat hr { border:0; border-top:1px dashed #2f3644; margin:18px 0; }
  .chat a { color:var(--acc); text-decoration:none; }
  .chat a:hover { text-decoration:underline; }
  .chat code { background:#1b2029; border:1px solid var(--line); border-radius:4px;
               padding:1px 5px; font-size:12.5px; color:#e3b341; }
  .chat pre { background:#0b0d12; border:1px solid var(--line); border-radius:8px;
              padding:12px 14px; margin:10px 0; overflow:auto; }
  .chat pre code { background:none; border:0; padding:0; color:#cbd5e1; }
  .chat blockquote { margin:10px 0; padding:6px 14px; border-left:3px solid var(--acc);
                     background:#131722; color:var(--soft); border-radius:0 6px 6px 0; }
  .chat blockquote p { margin:4px 0; }
  .chat ul, .chat ol { margin:8px 0; padding-left:24px; }
  .chat li { margin:3px 0; }
  .chat strong { color:var(--ink); }
  .chat table { border-collapse:collapse; margin:12px 0; width:100%; font-size:13px; }
  .chat th, .chat td { border:1px solid var(--line); padding:6px 10px;
                       text-align:left; vertical-align:top; }
  .chat th { background:#1b2029; color:var(--ink); font-weight:600; white-space:nowrap; }
  .chat tbody tr:nth-child(even) { background:#12151c; }
  /* 发言块结构（标题徽标 / 元数据条 / 会话分隔带）—— 规则见聊天室仓库 README 核心规则 8 */
  .chat .filehead { color:var(--soft); font-size:12.5px; border-bottom:1px dashed var(--line);
                    padding-bottom:10px; margin-bottom:6px; }
  .chat .filehead h2 { font-size:14px; border:0; padding:0; color:var(--soft); margin:0 0 6px; }
  .chat .blk { padding:2px 0 10px; }
  .chat .blk-closed { border-left:2px solid #4b5563; padding-left:12px; }   /* 已终结话题的历史块：灰线（同绿色线款，仅换灰） */
  .chat .blk-end { border-left:2px solid var(--ok); padding-left:12px; }
  .chat .blk-title { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:15px;
                     margin:6px 0; padding:0 0 6px; border-bottom:1px solid var(--line); }
  .chat .blk-title .no { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:#0b0d12;
                         background:var(--acc); border-radius:4px; padding:1px 6px; }
  .chat .blk-title .who { color:var(--ink); }
  .chat .blk-title .tag { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--acc);
                          border:1px solid var(--acc); border-radius:999px; padding:1px 9px; cursor:pointer; }
  .chat .blk-title .tag:hover { background:var(--acc); color:#0b0d12; }
  .chat .blk-title .tag-end { color:var(--ok); border-color:var(--ok); }
  .chat .blk-title .tag-end:hover { background:var(--ok); color:#0b0d12; }
  .chat .blk-title .re { font-size:12px; color:var(--soft); }
  .chat .blk-meta ul, .chat .blk-meta p { margin:2px 0 10px; }
  .chat .filterbar { display:flex; align-items:center; gap:10px; margin:0 0 12px; padding:8px 12px;
                     background:#141a26; border:1px solid var(--line); border-radius:8px;
                     font-size:12.5px; color:var(--soft); }
  .chat .filterbar code { background:none; border:0; color:var(--acc); padding:0; }
  /* 归档分隔条：以下为「上一页」的发言（CHAT.md 只留最近 100 条，2026-09-16 起页面一并展示最新归档） */
  .chat .archivebar { display:flex; align-items:center; gap:8px; margin:24px 0 12px; padding:8px 12px;
                      background:#1b1510; border:1px dashed #6b5033; border-radius:8px;
                      font-size:12.5px; color:#d9b382; }
  .chat .archivebar code { background:none; border:0; color:#f0c48a; padding:0; }
  .chat .filterbar button { padding:3px 10px; font-size:12px; }
  label.chk { display:flex; align-items:center; gap:6px; white-space:nowrap; font-size:13px;
              color:var(--soft); cursor:pointer; border:1px solid var(--line);
              border-radius:8px; padding:0 12px; }
  label.chk:hover { border-color:var(--acc); }
  label.chk input { flex:none; margin:0; }
  .hint { color:var(--soft); font-size:12px; margin:8px 2px 0; }
  .err { color:var(--bad); }
  .ok { color:var(--ok); }
  .spinner { color:var(--acc); }
  /* 标题行（含房间下拉与登出） */
  h1 .roomsel { width:auto; min-width:150px; }
  h1 .logout { text-decoration:none; color:var(--soft); font-size:13px;
               padding:4px 12px; border:1px solid var(--line); border-radius:8px; }
  h1 .logout:hover { color:var(--ink); border-color:var(--acc); }
  /* 登录门禁 */
  .login { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
           background:rgba(8,10,14,.93); z-index:50; }
  .login.hidden { display:none; }
  .login-card { background:var(--card); border:1px solid var(--line); border-radius:12px;
                padding:26px 28px; width:320px; display:flex; flex-direction:column; gap:12px; }
  .login-card h2 { margin:0 0 4px; font-size:18px; }
  .login-card input { width:100%; background:#0b0d12; color:var(--ink); border:1px solid var(--line);
                      border-radius:8px; padding:10px 12px; font-size:13.5px; outline:none; }
  .login-card input:focus { border-color:var(--acc); }
  .login-card button { width:100%; }
</style>
</head>
<body>
  <div class="login hidden" id="login">
    <div class="login-card">
      <h2 data-i18n="login.title">沟通室 · 登录</h2>
      <input id="username" placeholder="用户名" autocomplete="username">
      <input id="password" type="password" placeholder="密码" autocomplete="current-password">
      <button type="button" id="loginBtn" data-i18n="login.btn">登录</button>
      <div class="hint" id="loginHint"></div>
    </div>
  </div>

  <h1><span data-i18n="title.head">沟通室 · CHAT</span>
    <select id="roomSel" class="roomsel" disabled></select><span style="flex:1"></span>
    <a href="javascript:switchLang()" id="langBtn" class="logout" title="Toggle language / 切换语言"></a>
    <a href="javascript:logout()" id="logoutBtn" class="logout" data-i18n="logout">登出</a></h1>

  <div class="panel">
    <label class="fld"><span class="lbl" data-i18n="fld.from">发件人</span><input id="from" class="f" type="text" autocomplete="off"></label>
    <label class="fld"><span class="lbl" data-i18n="fld.to">收件人</span><input id="to" class="s" type="text" autocomplete="off"></label>
    <label class="fld grow"><span class="lbl" data-i18n="fld.subject">主题</span><input id="subject" type="text" autocomplete="off"></label>
    <label class="fld"><span class="lbl">Tag</span><input id="session" class="t" type="text" list="taglist" autocomplete="off" readonly></label>
    <datalist id="taglist"></datalist>
    <label class="fld"><span class="re-prefix" data-i18n="fld.reply">ReNo</span><input id="reply" class="xs" type="text" autocomplete="off" readonly></label>
    <label class="chk" id="noTagLbl">
      <input type="checkbox" id="noTag" checked> <span data-i18n="btn.plain">不带Tag</span>
    </label>
    <label class="chk">
      <input type="checkbox" id="createTag"> <span data-i18n="fld.create">创建Tag</span>
    </label>
    <label class="chk">
      <input type="checkbox" id="endTag"> <span data-i18n="fld.end">结束Tag</span>
    </label>
    <button type="button" id="speakBtn" data-i18n="speak">发言</button>
    <button type="button" id="updateBtn" data-i18n="update">刷新</button>
  </div>
  <div class="panel">
    <textarea id="msg"></textarea>
  </div>
  <div class="hint" id="hint"></div>
  <div class="chat" id="box" data-i18n="loading">加载中…</div>

<script>

};
function curLang(){ return (localStorage.getItem('chat_lang') === 'en') ? 'en' : 'zh'; }
function langDict(){ return I18N[curLang()] || I18N.zh; }
// t(key, ...args)：取当前语言文案，%s 依次替换；缺 key 回退中文，再缺回退 key 本身
function t(key){
  var d = langDict(), text = d[key];
  if (text === undefined) { text = I18N.zh[key]; }
  if (text === undefined) return key;
  for (var i = 1; i < arguments.length; i++) text = text.replace('%s', arguments[i]);
  return text;
}
function applyI18n(){
  document.documentElement.lang = curLang() === 'en' ? 'en' : 'zh-CN';
  // data-i18n 文本节点
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  // 登录框占位
  username && (username.placeholder = t('login.ph.user'));
  password && (password.placeholder = t('login.ph.pwd'));
  // 输入框占位 / title
  msg.placeholder = t('ph.msg');
  from.placeholder = t('ph.from'); to.placeholder = t('ph.to');
  subject.placeholder = t('ph.subject'); session.placeholder = t('ph.session');
  // 语言切换按钮文案 = 另一个语言
  var lb = document.getElementById('langBtn');
  if (lb) lb.textContent = t('lang.switch');
  // 房间下拉提示
  roomSel && (roomSel.title = t('room.sel'));
  noTagLbl && (noTagLbl.title = t('btn.plain.tip'));
}
function switchLang(){

function localizeMeta(lines){
  if (curLang() !== 'en') return lines;
  var pairs = [
    ['- 时间：', '- Time: '], ['- Time:', '- Time: '],
    ['- 收件人：', '- To: '], ['- To:', '- To: '],
    ['- 主题：', '- Subject: '], ['- Subject:', '- Subject: '],
    ['- 对话：', '- Conversation: '], ['- 会话：', '- Conversation: '],
    ['- Conversation:', '- Conversation: '], ['- Session:', '- Conversation: ']
  ];
  return lines.map(function(l){
    for (var i = 0; i < pairs.length; i++){
      if (l.indexOf(pairs[i][0]) === 0) return pairs[i][1] + l.slice(pairs[i][0].length);
    }
    return l;
  });
}

// ── URL ↔ 房间同步【2026-09-17 修】──────────────────────────────────────────────
// 症状：下拉切换房间后，URL 里的 `?room=` 从不更新；而 `?room=` 又**优先于** localStorage，
//   于是「切换房间 → 点 ReNo」只会给地址栏加个 `#no-N`、room 仍是旧值
//   ⇒ 刷新 / 分享 / 复制链接都会落回**旧房间**（用户报：「只改变 no 锚点，room 未变」）。
// 规则：currentRoom 一变就把 URL 同步过去；用 replaceState **不刷历史**（切房不进后退栈）；
//   切房时清掉旧锚点（那个 `#no-N` 属于旧房间的内容，留着无意义且会误导）。
function syncUrl(keepHash){
  try {
    var q = currentRoom ? ('?room=' + encodeURIComponent(currentRoom)) : '';
    history.replaceState(null, '', location.pathname + q + (keepHash ? location.hash : ''));
  } catch (e) { /* 个别环境禁用 history（如 file://）→ 静默忽略 */ }
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// 行内标记 → HTML。步骤：① 抽出代码跨度（占位符）② 整体转义并套用行内规则 ③ 占位符还原为 <code>
// 代码跨度按「反引号连续个数精确配对」处理 —— 这样 `` `#44` `` 这类「用双反引号包住单个反引号」
// 的写法不会错配（2026-09-15 实测：简单正则 /`([^`]+)`/ 会把本房间的 `` `#44` `` 配成半个标签）。
// 裸 URL / <URL> 自动成链（2026-09-17 用户要求：让发言里的链接可跳转）。
// 只处理**纯文本里的 URL**：已是 <a> 的片段原样放行（避免二次包裹）；代码跨度不受影响
// （inline() 里先抽代码为占位符，此时尚未还原）。
function linkify(html){
  return html.replace(/(<a\b[^>]*>[\s\S]*?<\/a>)|(?:&lt;|<)(https?:\/\/[^>&\s]+)(?:&gt;|>)|([\s(（，、；：]|^)(https?:\/\/[^\s<>"'）)，、；：！？。…」』】]+)/g,
    function(m, a, ang, pre, bare){
      if (a) return a;                                   // 已是链接：别动
      if (ang) return '<a href="' + ang + '" target="_blank" rel="noopener">' + ang + '</a>';
      var tail = '', u = bare, t = /[.,;:!?]+$/.exec(u);
      if (t){ tail = t[0]; u = u.slice(0, -tail.length); }  // 句末标点不并入 URL
      return pre + '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>' + tail;
    });
}

function inline(s){
  s = String(s);
  var codes = [], work = '', i = 0;
  while (i < s.length){
    if (s[i] === '`'){
      var n = 0;
      while (s[i + n] === '`') n++;
      var open = s.substr(i, n), close = s.indexOf(open, i + n);
      while (close >= 0 && s[close + n] === '`') close = s.indexOf(open, close + 1); // 收尾须恰好 n 个
      if (close < 0){ work += s.slice(i); break; }                                  // 未闭合：原样保留
      codes.push(s.slice(i + n, close));
      work += '\u0000' + (codes.length - 1) + '\u0000';
      i = close + n;
    } else {
      var j = s.indexOf('`', i);
      if (j < 0) j = s.length;
      work += s.slice(i, j);
      i = j;
    }
  }
  var out = esc(work)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(_, t, u){
      var href;
      if (/^https?:/i.test(u)) {                         // 外链：原样
        href = u;
      } else {
        // 站内文件（相对路径或 file://）→ 走本服务代理路由（fileHref，仓库内相对路径；仓库私有也能访问）
        var p = u.replace(/^file:\/\//i, '');
        var mark = currentRoom ? (currentRoom + '/') : '';
        if (mark && p.indexOf(mark) >= 0) p = p.slice(p.indexOf(mark) + mark.length);   // 绝对 file:// 路径：取仓库内相对路径
        // 其余（不含当前仓库名标记）保持原样，即为「仓库根起的相对路径」，不可截断为文件名
        href = fileHref(p);
      }
      return '<a href="' + href + '" target="_blank" rel="noopener">' + t + '</a>';
    })
    .replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>')
    .replace(/~~([\s\S]+?)~~/g, '<del>$1</del>');
  out = linkify(out);                       // 裸 URL / <URL> → 可点链接
  return out.replace(/\u0000(\d+)\u0000/g, function(_, k){
    return '<code>' + esc(codes[+k]) + '</code>';
  });
}
function setHint(t, cls){ hint.textContent=t; hint.className='hint '+(cls||''); }

// CHAT.md → HTML（自包含迷你 Markdown：标题 / 表格 / 列表 / 引用 / 代码块 / 分隔线 + 行内标记）。
// 链接：`[文本](url)`、`<url>`、裸 `https://…` 都会渲染成可点链接（后两者由 linkify() 处理）。
// 为什么不用 CDN 的 marked.js：聊天室是全自包含静态页（无外链依赖）。
function render(md){
  var lines = String(md).replace(/\r\n?/g, '\n').split('\n');
  var out = [], i = 0;

  function isSep(s){ return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(s); }
  function cells(s){ return s.trim().replace(/^\|/, '').replace(/\|$/, '').split('|')
                            .map(function(c){ return c.trim(); }); }
  function isBlockStart(s){
    return /^\s*```/.test(s) || /^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(s) || /^#{1,6}\s/.test(s) ||
           /^\s*>/.test(s) || /^\s*([-*+]|\d+\.)\s+/.test(s) ||
           (s.indexOf('|') >= 0 && i + 1 < lines.length && isSep(lines[i + 1]));
  }
  function list(items, ordered){
    var tag = ordered ? 'ol' : 'ul', h = '<' + tag + '>', lvl = 0;
    items.forEach(function(it){
      if (it.lvl > lvl){ h += '<' + tag + '>'; lvl = it.lvl; }
      else if (it.lvl < lvl){ h += '</' + tag + '>'; lvl = it.lvl; }
      h += '<li>' + inline(it.text) + '</li>';
    });
    while (lvl-- > 0) h += '</' + tag + '>';
    return h + '</' + tag + '>';
  }

  while (i < lines.length){
    var line = lines[i], m;

    if (/^\s*```/.test(line)){                                    // 代码块
      var lang = line.replace(/^\s*```/, '').trim(), buf = [];
      for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) buf.push(lines[i]);
      i++;
      out.push('<pre' + (lang ? ' data-lang="' + esc(lang) + '"' : '') + '><code>' +
               esc(buf.join('\n')) + '</code></pre>');
      continue;
    }
    if (!line.trim()){ i++; continue; }                            // 空行
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){ out.push('<hr>'); i++; continue; }

    m = /^(#{1,6})\s+(.*)$/.exec(line);                            // 标题（降一级：正文 h1 → h2）
    if (m){ var lv = Math.min(m[1].length + 1, 6);
            out.push('<h' + lv + '>' + inline(m[2]) + '</h' + lv + '>'); i++; continue; }

    if (line.indexOf('|') >= 0 && i + 1 < lines.length && isSep(lines[i + 1])){   // 表格
      var head = cells(line);
      i += 2;
      var body = [];
      while (i < lines.length && lines[i].trim() && lines[i].indexOf('|') >= 0){
        body.push(cells(lines[i])); i++;
      }
      var t = '<table><thead><tr>' +
              head.map(function(c){ return '<th>' + inline(c) + '</th>'; }).join('') +
              '</tr></thead><tbody>';
      body.forEach(function(r){
        t += '<tr>';
        for (var k = 0; k < head.length; k++){
          t += '<td>' + inline(r[k] === undefined ? '' : r[k]) + '</td>';
        }
        t += '</tr>';
      });
      out.push(t + '</tbody></table>');
      continue;
    }
    if (/^\s*>/.test(line)){                                       // 引用（递归渲染内含块）
      var q = [];
      while (i < lines.length && /^\s*>/.test(lines[i])){
        q.push(lines[i].replace(/^\s*>\s?/, '')); i++;
      }
      out.push('<blockquote>' + render(q.join('\n')) + '</blockquote>');
      continue;
    }
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)){                        // 列表（缩进 ≥2 空格视为一级嵌套）
      var ordered = /^\s*\d+\.\s+/.test(line), items = [];
      while (i < lines.length){
        m = /^(\s*)([-*+]|\d+\.)\s+(.*)$/.exec(lines[i]);
        if (!m) break;
        items.push({ lvl: m[1].replace(/\t/g, '    ').length >= 2 ? 1 : 0, text: m[3] });
        i++;
      }
      out.push(list(items, ordered));
      continue;
    }
    var p = [];                                                    // 段落
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])){ p.push(lines[i]); i++; }
    if (!p.length){ p.push(lines[i]); i++; }                       // 兜底：绝不空转
    out.push('<p>' + p.map(inline).join('<br>') + '</p>');
  }
  return out.join('\n');
}

// ---- 发言块与会话字段解析（规则见聊天室仓库 README 核心规则 8）----
// 发言块判定：`^# ` 行且其下 1~3 个非空行内出现 `- 时间：`（代码围栏内不算）。
// 字段只在**块头元数据区**取（标题行之后、首个空行之前的 `- x：` 行）——正文里的同名文本不算。
function parseChat(md){
  var lines = String(md).replace(/\r\n?/g, '\n').split('\n');
  var starts = [], inCode = false, i, k;
  for (i = 0; i < lines.length; i++){
    if (/^\s*```/.test(lines[i])){ inCode = !inCode; continue; }
    if (inCode || !/^# /.test(lines[i])) continue;
    var nb = [];
    for (k = i + 1; k < lines.length && nb.length < 3; k++){ if (lines[k].trim()) nb.push(lines[k]); }
    if (nb.some(function(l){ return /^- (时间：|Time:)/.test(l); })) starts.push(i);
  }
  var pre = lines.slice(0, starts.length ? starts[0] : lines.length).join('\n');
  var blocks = [];
  starts.forEach(function(s, n){
    var seg = lines.slice(s, (n + 1 < starts.length) ? starts[n + 1] : lines.length);
    var title = seg[0], meta = [], j = 1;
    while (j < seg.length && !seg[j].trim()) j++;                        // 标题与元数据之间有空行
    while (j < seg.length && /^- /.test(seg[j].trim())){ meta.push(seg[j].trim()); j++; }
    var body = seg.slice(j).join('\n').replace(/\n+---\s*\n?$/, '\n').trim();   // 去掉块尾分隔线
    var t = /^#\s+(.*?)\s*No\.(\d+)\s*$/.exec(title);
    var b = { no: t ? 'No.' + t[2] : '', speaker: t ? t[1] : title.replace(/^#\s+/, ''),
              tag: '', tagEnd: false, reply: '', metaLines: [], body: body };
    meta.forEach(function(line){
      // 会话元数据行：中文「对话：/会话：」或英文「Conversation:/Session:」
      var conv = null;
      var mC = /^- Conversation:\s*(.*)$/.exec(line) || /^- Session:\s*(.*)$/.exec(line);
      if (mC){ conv = mC[1]; }
      else {
        var m = /^- ([^：]+)：(.*)$/.exec(line);
        if (m && (m[1] === '对话' || m[1] === '会话')){ conv = m[2]; }
      }
      if (conv != null){
        // 对话字段语法（2026-09-17 统一）：NewTag:<短名> / Tag:<短名>[ ReNo:<n>] / EndTag:<短名>
        // 旧写法（Tag.<短名> / End: Tag.<短名> / Re: No.<n>）一律兼容；内部规范 key 仍是 Tag.<短名>。
        var val = conv.trim();
        if (/^EndTag:/.test(val)){ b.tagEnd = true; val = val.slice(7).trim(); }
        else if (/^End:/.test(val)){ b.tagEnd = true; val = val.slice(4).trim(); }
        if (/^NewTag:/.test(val)){ val = val.slice(7).trim(); }   // 过渡写法：等同 Tag:
        else if (/^Tag:/.test(val)){ val = val.slice(4).trim(); }
        var r = /(?:ReNo[:.]|Re:\s*No\.)(\d+)/.exec(val);   // 新 ReNo:<n> / 旧的 ReNo.<n> / 更旧的 Re: No.<n>
        if (r){ b.reply = 'No.' + r[1]; val = val.slice(0, r.index).trim(); }
        b.tag = val ? (/^Tag\./.test(val) ? val : ('Tag.' + val)) : '';
        return;
      }
      b.metaLines.push(line);                           // 其余元数据**原样保留**（逐行渲染）
    });
    blocks.push(b);
  });
  return { pre: pre, blocks: blocks };
}

function anchorOf(no){ return no ? no.toLowerCase().replace(/[^a-z0-9]+/g, '-') : ''; }

function blockHtml(b){
  var closedCls = (b.tag && closedTags[b.tag]) ? ' blk-closed' : '';
  var h = ['<section class="blk' + (b.tagEnd ? ' blk-end' : closedCls) + '"' +
           (b.no ? ' id="' + anchorOf(b.no) + '"' : '') + '>'];
  h.push('<div class="blk-title"' +
         (b.no ? ' data-no="' + esc(b.no) + '"' : '') +
         ' data-speaker="' + esc(b.speaker) + '"' +
         (b.tag ? ' data-tag="' + esc(b.tag) + '"' : '') +
         ' title="' + esc(t('tb.fill')) + '">');
  if (b.no) h.push('<span class="no">' + esc(b.no) + '</span>');
  h.push('<span class="who">' + esc(b.speaker) + '</span>');
  if (b.tag){
    h.push('<span class="tag' + (b.tagEnd ? ' tag-end' : '') + '" data-tag="' + esc(b.tag) +
           '" title="' + esc(t('tg.click')) + '">' + esc(tagBadge(b)) + '</span>');
  }
  if (b.reply) h.push('<a class="re" href="#' + anchorOf(b.reply) + '" title="' + esc(b.reply) + '">'
                      + esc(reLabel(b.reply)) + '</a>');
  h.push('</div>');
  // 元数据**按原始格式逐行**渲染（`- 时间：/ - 收件人：/ - 主题：` 各占一行）；
  // `- 对话：` 行由标题徽标表达，不在这里重复（2026-09-15 用户明确：元数据保持原样）。
  if (b.metaLines.length) h.push('<div class="blk-meta">' + render(localizeMeta(b.metaLines).join('\n')) + '</div>');
  h.push('<div class="blk-body">' + render(b.body) + '</div>');
  h.push('</section>');
  return h.join('');
}

// 会话信息由每条标题上的**徽标**表达（同一对话的发言带同一徽标）——不再另插分隔带：
// 分隔带与徽标内容重复，2026-09-15 用户明确去掉。
// 沟通室规则已移入本仓库 README.md（规则给 Agent 看，2026-09-17 用户定：页面不再显示）。
// opts: {skipHead: 不渲染文件抬头（归档段用）; noFilterBar: 不重复渲染筛选条; filterCount: 覆盖筛选计数}
function renderChat(md, filter, opts){
  opts = opts || {};
  var p = parseChat(md);
  if (!p.blocks.length) return opts.skipHead ? '' : '';
  var out = [];
  if (filter && !opts.noFilterBar){
    var n = (typeof opts.filterCount === 'number') ? opts.filterCount
            : p.blocks.filter(function(b){ return b.tag === filter; }).length;
    out.push('<div class="filterbar">' + t('hf.onlytag','<code>'+esc(tagLabel(filter))+'</code>', n) +
             '<button type="button" id="clearFilter">' + t('hf.clearing') + '</button></div>');
  }
  p.blocks.forEach(function(b){
    if (filter && b.tag !== filter) return;
    out.push(blockHtml(b));
  });
  return out.join('\n');
}

// 当前仍在讨论中的会话 = 最近一条带标签、且该标签未被 End 的块（规则 8「一次只讨论一个主题」）
function openTopic(p){
  var latest = -1, tag = '';
  p.blocks.forEach(function(b){
    if (!b.tag || !b.no) return;
    var n = parseInt(b.no.slice(3), 10);
    if (n > latest){ latest = n; tag = b.tag; }
  });
  return (tag && !closedTags[tag]) ? tag : '';
}

// 会话发起人 = 最早带该标签那一条的发言人（规则 8：只有发起人可以 End）
function tagOwner(p, tag){
  var owner = '', best = -1;
  p.blocks.forEach(function(b){
    if (b.tag !== tag || !b.no) return;
    var n = parseInt(b.no.slice(3), 10);
    if (best < 0 || n < best){ best = n; owner = b.speaker; }
  });
  return owner;
}

// 把「53 / No.53 / Re: No.53」统一成 No.<n>（取不到数字返回 ''）
function reNo(v){
  var m = /(\d+)/.exec(String(v == null ? '' : v));
  return m ? ('No.' + m[1]) : '';
}

// Tag 输入：**只填短名**（无需 `Tag.` 前缀，如 cup-quota-0917）。
// bareTag() 归一为短名（顺带吃掉 `End:` 前缀与误输入的 `Tag.`）；fullTag() 补回规范形式 Tag.<短名>。
function bareTag(v){
  return String(v == null ? '' : v).trim()
         .replace(/^EndTag:\s*/i, '').replace(/^End:\s*/i, '')
         .replace(/^NewTag:\s*/i, '').replace(/^Tag[:.]\s*/i, '')
         .replace(/^#/, '').trim();
}
function fullTag(v){ var b = bareTag(v); return b ? ('Tag.' + b) : ''; }

// Tag 的**显示**文案：`Tag.<短名>` → `Tag:<短名>`（2026-09-17 用户定；配合 reLabel() 读作
// 「对话：Tag:<短名> ReNo:<编号>」。已统一到全部显示位置：标题徽标 / 筛选条 / 各类提示文案）。
// ⚠️ 纯显示层，两条铁律：
//   ① 凡是**比较 / 存储 / 提交**（closedTags 判定、tagOwner、filterTag、data-tag、提交给服务端）
//      一律用规范形式 `Tag.<短名>`；
//   ② 凡是**给人看**的文本，一律套 tagLabel()。
//   ⇒ 渲染出的 `#` 只在 HTML 文本节点里，CHAT.md 一字不动。
function tagLabel(v){ var b = bareTag(v); return b ? ('Tag:' + b) : ''; }
function endTagLabel(v){ var b = bareTag(v); return b ? ('EndTag:' + b) : ''; }

// 标题行徽标（2026-09-17 定稿语法）：Tag:<短名> / EndTag:<短名>
function tagBadge(b){
  var s = bareTag(b.tag); if (!s) return '';
  return (b.tagEnd ? 'EndTag:' : 'Tag:') + s;
}

// 回应编号的**显示**文案：`No.144` → `ReNo:144`（2026-09-17 用户定，与 No.<n> 同形；
// 与 Tag: 一起读作「对话：Tag:xxx ReNo:144」）。文件里同样是 `ReNo:<n>`。
function reLabel(v){
  var m = /(\d+)/.exec(String(v == null ? '' : v));
  return m ? ('ReNo:' + m[1]) : '';
}

// 缺省值（规则 8）：主题还在讨论中 ⇒「当前会话 + 回应上一条」；上一个主题已 End ⇒ 留空待填新标签
function applyDefault(p){
  var open = openTopic(p), maxNo = 0;
  p.blocks.forEach(function(b){ if (b.no) maxNo = Math.max(maxNo, parseInt(b.no.slice(3), 10)); });
  // UI 规则（2026-09-17 用户定）：Tag / 回复No. 的默认值 = **上一条发言**（最新一条）的 Tag / No.；没有就留空。
  var last = p.blocks.length ? p.blocks[0] : null;
  var dTag = last ? bareTag(last.tag) : '', dReply = (last && last.no) ? last.no.slice(3) : '';
  if (!plainPost){   // 普通发言模式：Tag/ReNo 保持空（不被默认值回填）
    if (!createTag.checked && (session.value.trim() === '' || session.value.trim() === lastAutoTag)) session.value = dTag;
    if (reply.value.trim() === '' || reply.value.trim() === lastAutoReply) reply.value = dReply;
  }
  lastAutoTag = dTag;
  lastAutoReply = dReply;

  // 收件人默认＝最近一条消息的作者（便于直接回复上一个人）；
  // 若最近一条是本人发的，则保持空（占位「所有人」），避免「回复自己」。
  var lastSpeaker = p.blocks.length ? p.blocks[0].speaker : '';
  var dTo = (lastSpeaker && lastSpeaker !== selfSpeaker()) ? lastSpeaker : '';
  if (to.value.trim() === '' || to.value.trim() === lastAutoTo) to.value = dTo;
  lastAutoTo = dTo;

  // Re: 编号占位提示＝当前最新一条的编号（不再写死 53）；无发言时退化为「编号」
  reply.placeholder = maxNo ? String(maxNo) : t('ph.reply');
}

// CHAT.md + 最新归档的**合并视图**：页面展示与规则判定都基于它
// （与后端 parseBlocks 跨归档一致 —— 取号 / 会话 End 状态 / 回应目标都跨页成立）。
function allParsed(){
  var a = parseChat(rawMd);
  var b = rawArchive ? parseChat(rawArchive) : { pre: '', blocks: [] };
  return { pre: a.pre, blocks: a.blocks.concat(b.blocks) };
}

// 归档段 HTML（分隔条 + 归档全部块）；无归档时为空串
function archiveHtml(filter, total){
  if (!rawArchive) return '';
  return '<div class="archivebar">' + t('hf.archive', '<code>' + esc(archiveName) + '</code>') +
         '</div>' +
         renderChat(rawArchive, filter, { skipHead: true, noFilterBar: true, filterCount: total });
}

function paint(){
  var p = allParsed(), ended = {}, seen = {}, opts = [];
  p.blocks.forEach(function(b){ if (b.tag && b.tagEnd) ended[b.tag] = 1; });
  closedTags = ended;
  p.blocks.forEach(function(b){                        // 下拉里只给「未结束」的标签
    if (!b.tag || ended[b.tag] || seen[b.tag]) return;
    seen[b.tag] = 1;
    opts.push('<option value="' + esc(bareTag(b.tag)) + '"></option>');
  });
  taglist.innerHTML = opts.join('');
  var fTotal = filterTag ? p.blocks.filter(function(b){ return b.tag === filterTag; }).length : 0;
  box.innerHTML = renderChat(rawMd, filterTag, { filterCount: fTotal }) + archiveHtml(filterTag, fTotal);
  applyDefault(p);
}

function warnTag(){
  var v = fullTag(session.value);      // 输入框是短名，比较/提示一律用规范形式 Tag.<短名>
  var p = allParsed(), open = openTopic(p), r = reNo(reply.value);
  var knownTags = {};                  // 该 Tag 是否已存在
  p.blocks.forEach(function(b){ if (b.tag) knownTags[b.tag] = 1; });

  // 普通发言（不带对话 Tag）：无需 Tag/ReNo ⇒ 放行（服务端 session/reply 为空时不写「对话：」行）
  if (plainPost && !createTag.checked && !endTag.checked){ setHint(t('warn.plain'), 'ok'); return; }
  // 结束行为：Tag 为空 ⇒ 提示点击某条发言的标题，选择要结束的对话
  if (endTag.checked){
    if (!v){ setHint(t('warn.end.needtag'), 'err'); return; }
    var owner = tagOwner(p, v);
    if (owner && owner !== selfSpeaker()){
      setHint(t('warn.end.notowner', tagLabel(v), owner), 'err');
      return;
    }
    if (!knownTags[v]){ setHint(t('warn.end.never', tagLabel(v)), 'err'); return; }
    setHint(t('warn.end.willwrite', endTagLabel(v), r ? t('warn.into.re', r) : ''), '');
    return;
  }
  // 创建行为：必须带 Tag，且该短名不能已存在
  if (createTag.checked){
    if (!v){ setHint(t('warn.create.needtag'), 'err'); return; }
    if (knownTags[v]){ setHint(t('warn.create.exists', tagLabel(v)), 'err'); return; }
    setHint(t('warn.create.willwrite', tagLabel(v)), '');
    return;
  }
  // 回复行为：必须带回应编号（不再允许只带 Tag 的自由发言）
  if (v && closedTags[v]){
    setHint(t('warn.closed', tagLabel(v)), 'err'); return;
  }
  var others = [];
  p.blocks.forEach(function(b){
    if (b.tag && !closedTags[b.tag] && b.tag !== v && others.indexOf(b.tag) < 0) others.push(b.tag);
  });
  if (v && others.length){
    setHint(t('warn.openothers', others.map(tagLabel).join(t('sep.list'))), 'err'); return;
  }
  if (v && !r){ setHint(t('warn.reply.needno'), 'err'); return; }
  if (v){ setHint(t('warn.into', tagLabel(v), r ? t('warn.into.re', r) : ''), ''); return; }
  if (open){ setHint(t('warn.noopen.default', tagLabel(open)), 'err'); return; }
  setHint(t('warn.noopen'), '');
}

// 深链跳转：`?room=X#no-N` 打开 / 刷新后要**真的滚到**那条发言 ——
// 内容是异步 innerHTML 插入的，浏览器不会为「后插入的元素」自动重试锚点跳转，故显式滚一次。
// 目标不在当前显示范围（更早的归档未加载）时给出明确提示，而不是「点了没反应」。
var lastHashScrolled = '';   // 同一锚点只自动滚一次（否则每次发言/刷新都会跳回老位置）
function scrollToHash(){
  var h = (location.hash || '').replace(/^#/, '');
  if (!h || h === lastHashScrolled) return;
  lastHashScrolled = h;
  var el = document.getElementById(h);
  if (el && el.scrollIntoView) { el.scrollIntoView({block: 'start'}); return; }
  setHint(t('hint.anchor.none', 'No.' + h.replace(/^no-/, '')), 'err');
}

function show(content, note, archive, archName){
  rawMd = content;
  rawArchive = archive || '';
  archiveName = archName || '';
  paint();
  // ⚠️ 顺序：先出「已读取…」的常规提示，再跑深链跳转 —— 否则「找不到该编号」的提示会被它覆盖
  if(note) setHint(note, 'ok');
  scrollToHash();
}

// 点会话徽标 = 只看该会话；点「取消筛选」恢复全部
box.addEventListener('click', function(e){
  // ⚠️ 事件目标**不能**叫 t：`t` 是 i18n 的翻译函数，`var t` 会在本函数内遮蔽它，
  // 使下面的 `t('fld.fillnote', …)` 变成「对事件对象调用」⇒ 抛 `t is not a function`，
  // 于是**填充表单的代码整段不执行**（2026-09-17 实测：点标题条只报错、收件人/Tag/ReNo 不动）。
  var tgt = e.target;
  if (tgt && tgt.id === 'clearFilter'){ filterTag = ''; paint(); return; }
  var el = (tgt && tgt.closest) ? tgt.closest('.tag') : null;
  if (el){
    var v = el.getAttribute('data-tag');
    filterTag = (filterTag === v) ? '' : v;
    paint();
    return;
  }
  // 点 ReNo 链接（href="#no-N"）= 跳到被回应的那条发言。
  // 显式滚动：hash 已是目标时浏览器不会再滚（连点同一条会「没反应」）。
  // ⚠️ 不能 return：a.re 在 .blk-title 内，点它**仍然要**触发下面的「填回复表单」行为
  //（原有行为保留，本次只**新增**「一定滚到位 + 找不到时提示」）。
  var missingRe = '';
  var re = (tgt && tgt.closest) ? tgt.closest('a.re') : null;
  if (re){
    var rid = (re.getAttribute('href') || '').replace(/^#/, '');
    var rel = rid ? document.getElementById(rid) : null;
    if (rel && rel.scrollIntoView) { rel.scrollIntoView({block: 'start'}); lastHashScrolled = rid; }
    else missingRe = 'No.' + rid.replace(/^no-/, '');   // 提示在下面「已填充」之后补，避免被覆盖
  }
  // 点击任一条的标题条 → 自动填充回复表单（收件人=发言人；仅当该条带 Tag 时才一并填 Tag 与 Re:No，
  // 因为规则要求 Re 必须与 Tag 同行，否则不合规）
  var bt = (tgt && tgt.closest) ? tgt.closest('.blk-title') : null;
  if (bt){
    var s = bt.getAttribute('data-speaker');
    var st = bt.getAttribute('data-tag');
    var note = s ? t('fld.fillnote', s) : '';
    if (s) to.value = s;
    if (st){                                   // 有 Tag 才填 Tag + Re:No（输入框只填短名）
      session.value = bareTag(st);
      var sn = (bt.getAttribute('data-no') || '').replace(/^No\./, '');
      if (sn) reply.value = sn;
      note += (sn ? t('fld.fillreply', 'No.' + sn) : '') + t('fld.fillconvo', tagLabel(st));
    }
    createTag.checked = false;                 // 点标题 = 回复行为 ⇒ 退出创建态
    plainPost = false;                         // 点标题条 ⇒ 自动取消「不带Tag」（转为回复该条）
    syncPlainChk();
    syncTagInputs();
    // ⚠️ 这里**不能**把刚填的值写进 lastAuto*：applyDefault() 的判定是「值 == lastAuto* 就当成
    // 「还停在自动默认值」并覆盖为默认」，而填完的值恰好等于 lastAuto* ⇒ 下一次重绘（点徽标筛选、
    // 点刷新…）会把刚填的收件人 / ReNo **打回默认**（2026-09-17 实测：填 No.149 后重绘变回 No.150）。
    // lastAuto* 只应记录「自动填的默认值」，用户/点击填充的值与它不等才不会被覆盖。
    setHint(t('hi.filled', note || t('fld.none')), 'ok');
    // 「找不到被回应的编号」优先于「已填充」提示：目标可能在更早、未显示的归档里
    if (missingRe) setHint(t('hint.anchor.none', missingRe), 'err');
  }
});
// 失焦 / 变更时把误输入的 `Tag.` 前缀（或 `End:`）去掉，输入框始终保持「短名」
function normalizeTagInput(){ var b = bareTag(session.value); if (b !== session.value) session.value = b; }
session.addEventListener('input', warnTag);
session.addEventListener('blur', normalizeTagInput);
session.addEventListener('change', normalizeTagInput);
// ── UI 规则（2026-09-17 用户定）───────────────────────────────────────────────
//  · Tag / 回复No. 默认只读：值来自「点上一条发言的标题」或默认值（上一条发言的 Tag / No.）
//  · 「创建Tag」与「结束Tag」互斥，默认都不选
//  · 创建行为：勾选后 Tag 可编辑、回复No. 清空、必须带 Tag
//  · 结束行为：Tag 为空时提示点击发言标题，选择要结束的对话
function syncTagInputs(){
  session.readOnly = !createTag.checked;   // 只有「创建Tag」才能手填 Tag
  reply.readOnly = true;                   // 回复No. 始终只读（由点击标题/默认值填充）
}
createTag.addEventListener('change', function(){
  if (createTag.checked){ endTag.checked = false; reply.value = ''; }   // 互斥 + 清空回复No.
  plainPost = false; syncPlainChk();                                    // 与「不带Tag」互斥：创建 = 对话行为
  syncTagInputs(); warnTag();
});
endTag.addEventListener('change', function(){
  if (endTag.checked){ createTag.checked = false; }
  plainPost = false; syncPlainChk();                                    // 与「不带Tag」互斥：结束 = 对话行为
  syncTagInputs(); warnTag();
});
// 「不带Tag」勾选（默认选中，与「创建Tag」「结束Tag」同款样式、三态互斥）：
// 勾上 ⇒ 清空 Tag/ReNo（本条不带对话）；取消 ⇒ 回到缺省（回复上一条）
noTagBox.addEventListener('change', function(){
  if (noTagBox.checked){ setPlainPost(true); }
  else { plainPost = false; syncPlainChk(); applyDefault(allParsed()); warnTag(); }
});
syncPlainChk();

function load(){
  busy(true); setHint(t('hi.reading'),'spinner');
  apiFetch('/api/chat' + roomQuery()).then(r=>r.json()).then(function(j){
    if(j.ok){
      renderRooms(j.rooms, j.room);
      // 免鉴权白名单聊天室：无登录概念，隐藏「登出」（有 token 进入时也隐藏，避免误导）
      if (logoutBtn) logoutBtn.style.display = (j.noauth) ? 'none' : '';
      show(j.content, t('hi.read', (j.room || ''), (j.repo || ''),
                      j.archive ? t('hi.arch', j.archiveName) : ''),
           j.archive, j.archiveName);
    }
    else setHint(j.error||t('err.readfail'),'err');
  }).catch(e=>{ if(e.message!=='unauthorized') setHint(t('err.reqfail')+e,'err'); }).finally(()=>busy(false));
}

function update(){
  busy(true); setHint(t('hi.pulling'),'spinner');
  apiFetch('/api/chat/update' + roomQuery(), {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})
    .then(r=>r.json()).then(function(j){
      if(j.ok){
        renderRooms(j.rooms, j.room);
        show(j.content, (j.note||t('hi.refreshed')) + (j.archive ? t('hi.refreshwitharch', j.archiveName) : ''),
             j.archive, j.archiveName);
      }
      else setHint(j.error||t('err.updfail'),'err');
    }).catch(e=>{ if(e.message!=='unauthorized') setHint(t('err.reqfail')+e,'err'); }).finally(()=>busy(false));
}

function speak(){
  var v = msg.value.trim();
  if(!v){ setHint(t('err.empty'),'err'); return; }
  if(!from.value.trim()){ setHint(t('err.speaker'),'err'); return; }
  var short = bareTag(session.value), tag = fullTag(session.value);   // 短名 / 内部规范 Tag.<短名>
  var p = allParsed(), isEnd = endTag.checked, isCreate = createTag.checked && !isEnd;
  if(!short && (isEnd || isCreate)){ setHint(t(isEnd ? 'warn.end.needtag' : 'warn.create.needtag'),'err'); return; }
  if(isEnd){
    var owner = tagOwner(p, tag);
    if(owner && owner !== selfSpeaker()){
      setHint(t('warn.end.notowner', tagLabel(tag), owner),'err'); return;
    }
  } else if(closedTags[tag]){
    setHint(t('warn.closed', tagLabel(tag)),'err'); return;
  }
  busy(true); setHint(t('hi.sending'),'spinner');
  apiFetch('/api/chat/speak' + roomQuery(), {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({content: v, from: from.value.trim(), to: to.value.trim(), subject: subject.value.trim(),
                              session: short ? ((isEnd ? 'EndTag:' : 'Tag:') + short) : '',
                              reply: short ? reply.value.trim() : '',
                              create: isCreate, lang: curLang()})})
    .then(r=>r.json()).then(function(j){
      if(j.ok){ msg.value=''; reply.value=''; endTag.checked=false; createTag.checked=false; plainPost=true; syncPlainChk(); syncTagInputs(); setHint(t('hi.sent'),'ok'); localStorage.setItem('chat_from', from.value.trim()); load(); }
      else setHint(j.error||t('err.speakfail'),'err');
    }).catch(e=>{ if(e.message!=='unauthorized') setHint(t('err.reqfail')+e,'err'); }).finally(()=>busy(false));
}

msg.addEventListener('keydown', function(e){ if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); speak(); } });
speakBtn.addEventListener('click', speak);
updateBtn.addEventListener('click', update);

// 文件代理链接：浏览器对 <a> 导航不会附带 Authorization，直接点会 401。
// 故在此拦截点击，用已登录的 JWT 取回内容后于新标签页打开（兼容私有仓库）。
document.getElementById('box').addEventListener('click', function(e){
var a = e.target.closest && e.target.closest('a');
if(!a) return;
var href = a.getAttribute('href') || '';
if(href.indexOf('/api/chat/file/') !== 0) return;
e.preventDefault();
var ext = (href.split('?')[0].split('#')[0].split('.').pop() || '').toLowerCase();
// 文本 / 二进制判定：**默认按文本处理**（聊天室附件绝大多数是代码或文本），只显式列出二进制。
// 2026-09-16 修：原先只列了 8 种文本后缀，`.py`（demo）等会落到「原样 blob」分支 ——
// 新标签页拿到服务端给的 `text/x-python`（非标准类型、且 Chrome 会丢掉 charset 参数）
// ⇒ 浏览器按本地编码解码 UTF-8 中文 = **乱码**。现在文本类一律显式补 `charset=utf-8`。
var BIN_EXT = {png:1, jpg:1, jpeg:1, gif:1, webp:1, bmp:1, ico:1, pdf:1, zip:1, gz:1, tgz:1, tar:1,
               mp3:1, mp4:1, webm:1, wav:1, woff:1, woff2:1, ttf:1, otf:1, exe:1, bin:1, xlsx:1, docx:1};
var TEXT_TYPE = {json:'application/json', csv:'text/csv'};   // 其余文本一律 text/plain
// ⚠️ html / svg 也按 text/plain 呈现，**绝不**给 text/html —— blob 会继承本站 origin，
// 以 text/html 渲染等于让附件里的脚本在本站域下执行。
fetch(href, {headers: authHeaders()})
  .then(function(r){
    if(r.status === 401){ showLogin(t('login.expired')); throw new Error('unauthorized'); }
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.blob();
  })
  .then(function(b){
    var blob = BIN_EXT[ext] ? b : new Blob([b], {type: (TEXT_TYPE[ext] || 'text/plain') + ';charset=utf-8'});
    var url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  })
  .catch(function(err){ if(err.message !== 'unauthorized') alert(t('err.openfile') + err); });
});

// 启动：总是先尝试读取。白名单聊天室无需登录即可进入（此时不显示登出）；
// 需要鉴权且无（或失效）token 时 /api/chat 返回 401 → 自动弹登录门禁。
applyI18n();
load();
</script>
</body>
</html>
