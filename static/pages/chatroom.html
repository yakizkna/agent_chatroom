<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 移动端：按设备宽度渲染（此前缺这行 ⇒ 手机按 ~980px 渲染再整体缩小，字小、控件难点） -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title.tab">沟通室 · RA</title>
<link rel="icon" href="/static/images/chatroom-icon.jpg">
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --ink:#e6e8ee;
          --soft:#9aa3b2; --ok:#34d399; --bad:#f87171; --acc:#60a5fa; }
  * { box-sizing: border-box; }
  body { margin:0; padding:28px; background:var(--bg); color:var(--ink);
         font:14px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  h1 { font-size:20px; margin:0 0 38px; display:flex; align-items:center; gap:10px; }
  /* 仓库下拉：高度 / 圆角与输入框（input，39px · 圆角 8px）保持一致 —— 用户 2026-09-18 指出「太高…不，是太矮」，
     原先只有 25px（padding 3px）像一条细缝。移动端另见媒体查询（44px）。 */
  /* 下拉统一样式（2026-09-19：由 `h1 .roomsel` 放宽为 `.roomsel`）⇒ 房间选择与「历史」归档选择共用同一套外观 */
  .roomsel { font-size:13.5px; background:#0b0d12; color:var(--ink);
             border:1px solid var(--line); border-radius:8px; padding:10px 12px; outline:none; }
  h1 .roomsel { vertical-align:2px; margin-left:10px; }
  .roomsel:focus { border-color:var(--acc); }
  .roomsel:disabled { opacity:.5; }
  .sub { color:var(--soft); font-size:13px; margin-bottom:20px; }
  .sub .mini { margin-left:10px; padding:2px 10px; font-size:12px;
               background:transparent; border:1px solid var(--line); color:var(--soft);
               border-radius:6px; cursor:pointer; text-decoration:none; display:inline-block; }
  .sub .mini:hover { color:var(--ink); border-color:var(--acc); }
  .panel { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .panel input.eq { flex:0 0 130px; min-width:0; }   /* 发件人 / 收件人 / 抄送：三者同宽 */
  .panel input.t  { flex:0 0 150px; min-width:0; }   /* Tag */
  .panel input.xs { flex:0 0 64px; min-width:0; }    /* Re 的编号数字（固定前缀「ReNo」见 .re-prefix）*/
  .panel .re-prefix { flex:0 0 auto; align-self:center; min-width:3em; text-align:right; color:#e3b341;
                      font-family:ui-monospace,Menlo,monospace; font-size:13px; user-select:none; }
  /* ↑ min-width/右对齐与 .lbl 同款（ReNo 也是标签列的一员）⇒ 输入框与其它字段同列 */
  .panel .fld { display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; }   /* 每个字段＝固定标签 + 输入框，和 Re: No 同款 */
  .panel .fld.grow { flex:1 1 auto; }                                              /* 主题：占满剩余行宽 */
  .panel .fld.grow input { flex:1 1 auto; min-width:160px; }
  /* 标签列固定宽（3em = 三个中文字宽）：发件人/收件人（3 字）与抄送/主题（2 字）右侧对齐
     ⇒ 所有输入框左边缘落在同一列，且「标签 → 输入框」的间隔一律 6px（用户 2026-09-18 要求）。 */
  .panel .lbl { flex:0 0 auto; min-width:3em; text-align:right; color:#e3b341; font-family:ui-monospace,Menlo,monospace;
                font-size:13px; user-select:none; white-space:nowrap; }
  /* 「收件人 / 抄送」历史输入：▾ 按钮（仅当有历史时出现）+ 下拉快选（发言成功后自动记录，最近 8 条） */
  .panel .fld { position:relative; }                 /* 历史菜单的定位参考 */
  .panel .hist { display:none; flex:0 0 auto; align-self:stretch; margin-left:2px; padding:0 8px;
                 background:#1f2632; color:var(--soft); border:1px solid var(--line); border-radius:8px;
                 cursor:pointer; font-size:11px; line-height:1; }
  .panel .hist.on { display:inline-flex; align-items:center; }   /* 有历史才出现 */
  .panel .hist:hover { border-color:var(--acc); color:var(--ink); }
  .panel .histmenu { position:absolute; z-index:30; top:calc(100% + 4px); right:0; min-width:190px;
                     max-width:min(320px, 86vw); max-height:min(50vh, 320px); overflow:auto;
                     background:#171a21; border:1px solid var(--line); border-radius:8px;
                     box-shadow:0 10px 26px rgba(0,0,0,.55); padding:4px;
                     display:flex; flex-direction:column; gap:2px; }
  .panel .histmenu[hidden] { display:none; }
  .panel .histmenu .hi { display:block; width:100%; text-align:left; padding:9px 10px; border:0;
                         background:transparent; color:var(--ink); font-size:13px; border-radius:6px;
                         cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .panel .histmenu .hi:hover { background:#222834; color:#fff; }
  .panel .histmenu .hi.clr { color:var(--soft); font-size:12px; margin-top:2px;
                             border-top:1px solid var(--line); border-radius:0 0 6px 6px; }
  /* 「收件人」发言用户多选（2026-09-20）：每行 = 复选框 + 名字（复用 .hi 的整行点击区与 hover） */
  .panel .histmenu .hi.pick { display:flex; align-items:center; gap:8px; cursor:pointer; }
  .panel .histmenu .hi.pick input { flex:none; width:14px; height:14px; margin:0; accent-color:var(--acc); }
  .panel .histmenu .hi.pick span { flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .panel .pickbtn.on { font-size:12px; }   /* 👥 是 emoji、字形本身偏大 ⇒ 12px 与 ▾（11px）视觉等观 */
  .panel .row { display:flex; gap:12px; margin-bottom:12px; }
  .panel .row .wide { flex:1; }
  input, textarea#msg { flex:1; background:#0b0d12; color:var(--ink); border:1px solid var(--line);
          border-radius:8px; padding:11px 14px; font-size:13.5px; outline:none; }
  textarea#msg { resize:vertical; height:88px; line-height:1.7; overflow:auto; }
  input:focus, textarea#msg:focus { border-color:var(--acc); }
  button { background:#1f2632; color:var(--ink); border:1px solid var(--line);
           border-radius:8px; padding:10px 18px; cursor:pointer; font-size:13.5px; white-space:nowrap; }
  button:hover { border-color:var(--acc); color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .bar { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .bar .title { font-size:14px; font-weight:600; color:var(--soft); letter-spacing:.5px; }
  .bar .spacer { flex:1; }
  /* 渲染后的 Markdown（CHAT.md 正文）—— 自包含样式，不引外部 CDN */
  .chat { background:#0b0d12; border:1px solid var(--line); border-radius:10px;
          padding:18px 22px; margin:0; min-height:60vh; overflow:auto;
          font-size:13.5px; line-height:1.75; color:#cbd5e1; word-break:break-word; }
  .chat > :first-child { margin-top:0; }
  .chat h2 { font-size:16px; color:var(--ink); margin:22px 0 8px;
             padding-bottom:6px; border-bottom:1px solid var(--line); }
  .chat h3 { font-size:14.5px; color:var(--ink); margin:16px 0 6px; }
  .chat h4, .chat h5, .chat h6 { font-size:13.5px; color:var(--soft); margin:12px 0 4px; }
  .chat p { margin:8px 0; }
  .chat hr { border:0; border-top:1px dashed #2f3644; margin:18px 0; }
  .chat a { color:var(--acc); text-decoration:none; }
  .chat a:hover { text-decoration:underline; }
  .chat code { background:#1b2029; border:1px solid var(--line); border-radius:4px;
               padding:1px 5px; font-size:12.5px; color:#e3b341; }
  .chat pre { background:#0b0d12; border:1px solid var(--line); border-radius:8px;
              padding:12px 14px; margin:10px 0; overflow:auto; }
  .chat pre code { background:none; border:0; padding:0; color:#cbd5e1; }
  .chat blockquote { margin:10px 0; padding:6px 14px; border-left:3px solid var(--acc);
                     background:#131722; color:var(--soft); border-radius:0 6px 6px 0; }
  .chat blockquote p { margin:4px 0; }
  .chat ul, .chat ol { margin:8px 0; padding-left:24px; }
  .chat li { margin:3px 0; }
  .chat strong { color:var(--ink); }
  .chat table { border-collapse:collapse; margin:12px 0; width:100%; font-size:13px; }
  .chat th, .chat td { border:1px solid var(--line); padding:6px 10px;
                       text-align:left; vertical-align:top; }
  .chat th { background:#1b2029; color:var(--ink); font-weight:600; white-space:nowrap; }
  .chat tbody tr:nth-child(even) { background:#12151c; }
  /* 发言块结构（标题徽标 / 元数据条 / 会话分隔带）—— 规则见聊天室仓库 README 核心规则 8 */
  .chat .filehead { color:var(--soft); font-size:12.5px; border-bottom:1px dashed var(--line);
                    padding-bottom:10px; margin-bottom:6px; }
  .chat .filehead h2 { font-size:14px; border:0; padding:0; color:var(--soft); margin:0 0 6px; }
  .chat .blk { padding:2px 0 10px; }
  .chat .blk-closed { border-left:2px solid #4b5563; padding-left:12px; }   /* 已终结话题的历史块：灰线（同绿色线款，仅换灰） */
  .chat .blk-end { border-left:2px solid var(--ok); padding-left:12px; }
  .chat .blk-title { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:15px;
                     margin:6px 0; padding:0 0 6px; border-bottom:1px solid var(--line); }
  .chat .blk-title .no { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:#0b0d12;
                         background:var(--acc); border-radius:4px; padding:1px 6px; }
  .chat .blk-title .who { color:var(--ink); }
  .chat .blk-title .tag { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--acc);
                          border:1px solid var(--acc); border-radius:999px; padding:1px 9px; cursor:pointer; }
  .chat .blk-title .tag:hover { background:var(--acc); color:#0b0d12; }
  .chat .blk-title .tag-end { color:var(--ok); border-color:var(--ok); }
  .chat .blk-title .tag-end:hover { background:var(--ok); color:#0b0d12; }
  .chat .blk-title .re { font-size:12px; color:var(--soft); }
  .chat .blk-meta ul, .chat .blk-meta p { margin:2px 0 10px; }
  .chat .filterbar { display:flex; align-items:center; gap:10px; margin:0 0 12px; padding:8px 12px;
                     background:#141a26; border:1px solid var(--line); border-radius:8px;
                     font-size:12.5px; color:var(--soft); }
  .chat .filterbar code { background:none; border:0; color:var(--acc); padding:0; }
  .chat .filterbar button { padding:3px 10px; font-size:12px; }
  /* 历史视图工具条（2026-09-19 加）：选归档文件，只读浏览。
     ⚠️ 样式**与页面统一**：容器直接用 .panel（行布局/间距同发件人那一行）、标签用 .lbl、
     下拉复用 .roomsel、按钮走全局 button ⇒ 这里只补两处微调。 */
  .histbar .histnote { color:var(--soft); font-size:13px; }
  .histbar .roomsel { max-width:min(460px, 72vw); }
  label.chk { display:flex; align-items:center; gap:6px; white-space:nowrap; font-size:13px;
              color:var(--soft); cursor:pointer; border:1px solid var(--line);
              border-radius:8px; padding:0 12px; align-self:center; }
  /* ⚠️ align-self:center 必需：.panel 是 flex（默认 align-items:stretch）⇒ 与「发言/刷新」同处一行的
     勾选项会被拉成按钮那么高（实测 24 → 41px），与 .chkrow 里的三个勾选（靠 align-items:center 保持 24px）不一致。 */
  label.chk:hover { border-color:var(--acc); }
  label.chk input { flex:none; margin:0; }
  /* 三个勾选（不带Tag / 创建Tag / 结束Tag）成组：桌面端保持原有并排宽度 */
  .chkrow { display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  /* 「自动刷新」右侧的上次刷新时间（HH:MM:SS） */
  .autots { font-size:11px; color:var(--soft); font-variant-numeric:tabular-nums; align-self:center; }
  /* 移动端悬浮「回顶部 / 写发言」按钮：默认不显示（桌面端保持无此按钮），滚动到一定深度才浮出 */
  .totop { display:none; }
  .hint { color:var(--soft); font-size:12px; margin:8px 2px 0; }
  .err { color:var(--bad); }
  .ok { color:var(--ok); }
  .spinner { color:var(--acc); }
  /* 标题行（含房间下拉与登出） */
  h1 .roomsel { width:auto; min-width:200px; }   /* 桌面：给最长的房名（rollinace_open_chatroom ≈146px + 内边距/箭头）留足余量，避免贴边 */
  h1 .logout { text-decoration:none; color:var(--soft); font-size:13px;
               padding:4px 12px; border:1px solid var(--line); border-radius:8px; }
  h1 .logout:hover { color:var(--ink); border-color:var(--acc); }
  /* 登录门禁 */
  .login { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
           background:rgba(8,10,14,.93); z-index:50; }
  .login.hidden { display:none; }
  .login-card { background:var(--card); border:1px solid var(--line); border-radius:12px;
                padding:26px 28px; width:320px; display:flex; flex-direction:column; gap:12px; }
  .login-card h2 { margin:0 0 4px; font-size:18px; }
  .login-card input { width:100%; background:#0b0d12; color:var(--ink); border:1px solid var(--line);
                      border-radius:8px; padding:10px 12px; font-size:13.5px; outline:none; }
  .login-card input:focus { border-color:var(--acc); }
  .login-card button { width:100%; }
  /* ---------------- 移动端（≤640px）----------------
     目标：字与控件不被缩小、输入框一行一个拉满、点按目标 ≥40px、长内容不横向溢出。
     ⚠️ 输入相关字体必须 ≥16px —— iOS Safari 对 <16px 的输入框会在聚焦时自动放大页面。 */
  @media (max-width: 640px) {
    body { padding:12px 12px 64px; }   /* 底部留白：滚到底时悬浮按钮不盖住最后一行 */
    /* 标题行与 PC 同构（用户 2026-09-18 要求）：沟通室 + 房间下拉**紧随其后**（不再另起一行），EN / 登出 靠右
       · 下拉 font-size 保持 16px（<16px 时 iOS 聚焦会放大整页），用 zoom:.875 把视觉尺寸压到 ≈14px
         ⇒ 24 字符长房名（rollinace_open_chatroom）在 390 屏也不截断
       · flex:0 1 auto = 够宽保持自然宽度、不够才收缩；spacer 用 flex:1 把 EN / 登出 顶到最右 */
    h1 { font-size:17px; margin:0 0 16px; flex-wrap:nowrap; gap:8px; }
    h1 .roomsel { order:0; flex:0 1 auto; width:auto; min-width:0; margin:0; padding:9px 10px;
                  font-size:16px; zoom:.875; }
    .panel .fld input { min-height:44px; }            /* 表单控件统一 44px（点按标准），与下拉等高 */
    h1 > span[data-i18n] { flex:0 0 auto; white-space:nowrap; }   /* 标题不参与收缩（320 屏上否则会折成两行） */
    h1 .logout { flex:0 0 auto; padding:6px 10px; font-size:12.5px; }
    h1 span[style] { display:inline; flex:1 1 auto; }   /* 恢复占位 spacer：把 EN / 登出 顶到右侧 */
    .sub { font-size:12.5px; margin-bottom:14px; }
    .panel { gap:8px; margin-bottom:12px; }
    /* 标签列加宽到 4.3em（≈56px）：中文 3 字（39px）与英文最宽标签 Subject（55px）都能容纳
       ⇒ 两种语言的输入框左边缘都对齐（桌面端 3em 已够，见 .panel .lbl） */
    .panel .lbl, .panel .re-prefix { min-width:4.3em; }   /* ReNo 与其它标签同列（否则它的输入框比其它字段左移一格） */
    .panel .fld, .panel .fld.grow { flex:1 1 100%; }  /* 字段一行一个（标签 + 拉满的输入） */
    .panel .fld.grow input { min-width:0; }
    .panel input.eq, .panel input.t, .panel input.xs { flex:1 1 auto; min-width:0; }
    .panel input.eq { width:100%; }
    /* Tag 独占一整行（用户 2026-09-18：原来与 ReNo 同行 ⇒ 输入框太短，Tag 名显示不全）；ReNo 另起一行 */
    .panel .fld.fld-tag { flex:1 1 100%; min-width:0; }
    .panel .fld.fld-re { flex:1 1 100%; }
    .panel .fld.fld-re input { flex:0 0 64px; }        /* 数字框保持窄（否则被上面的 flex:1 1 auto 拉宽） */
    input, select, textarea#msg, .login-card input { font-size:16px; }   /* 防 iOS 聚焦自动放大（select 同样会触发） */
    textarea#msg { height:104px; }
    button { padding:12px 16px; min-height:44px; font-size:14px; }
    #speakBtn, #updateBtn { flex:1 1 100%; }          /* 发言 / 刷新 各占一整行（拇指友好；发言为主） */
    /* 四类勾选（不带Tag / 创建Tag / 结束Tag / 自动刷新）统一同款（2026-09-18 用户要求）：
       40px 高、12.5px 字、内容居中 —— 原先「自动刷新」还是桌面那套 24px/13px/12px 内边距，明显不一样 */
    label.chk { flex:1 1 0; padding:0 6px; min-height:40px; justify-content:center; font-size:12.5px; }
    /* 勾选组：整行三等分（避免被挤进 Tag 那一行）；自动刷新独占剩余宽度，时间戳跟随其后 */
    .chkrow { flex:1 1 100%; gap:6px; }
    /* 自动刷新：宽度与「不带Tag」一致（1/3 格；减掉 .chkrow 的两个 6px 间距 ⇒ 与它那格精确等宽） */
    #autoRefreshLbl { flex:0 0 calc((100% - 12px) / 3); }
    .autots { flex:0 0 auto; }
    .chat { padding:14px; min-height:45vh; font-size:14px; border-radius:8px; }
    .chat .blk-title { font-size:14.5px; gap:6px; }
    .chat .blk-closed, .chat .blk-end { padding-left:9px; }
    .chat table { display:block; width:100%; overflow-x:auto; }  /* 宽表格改为块内横滚，不撑破页面 */
    .chat pre { max-width:100%; }
    .chat .filterbar { flex-wrap:wrap; gap:6px; }
    .login-card { width:min(320px, 92vw); padding:20px 18px; }
    /* 悬浮「↑ 写发言」：滚动 400px 后才浮出（.on 由 JS 切换）；避让 iPhone 底部横条 */
    .totop {
      display:inline-flex; align-items:center; gap:5px;
      position:fixed; right:14px; bottom:calc(16px + env(safe-area-inset-bottom, 0px));
      z-index:40; padding:11px 16px; border-radius:999px; font-size:13.5px;
      background:#1f2632; color:var(--ink); border:1px solid var(--acc);
      box-shadow:0 6px 18px rgba(0,0,0,.45);
      opacity:0; pointer-events:none; transform:translateY(6px); transition:opacity .18s, transform .18s;
    }
    .totop b { font-size:15px; color:var(--acc); }
    .totop.on { opacity:1; pointer-events:auto; transform:none; }
  }
  /* 更窄的机器（≤380px）：再省一点留白，保证两个按钮仍并排 */
  @media (max-width: 380px) {
    body { padding:10px 10px 60px; }   /* 同样保留底部留白（此处会覆盖上一层媒体查询） */
    h1 { font-size:16px; }
    .chat { padding:10px; }
    #speakBtn, #updateBtn { padding:12px 10px; }
  }
</style>
</head>
<body>
  <div class="login hidden" id="login">
    <div class="login-card">
      <h2 data-i18n="login.title">沟通室 · 登录</h2>
      <input id="username" placeholder="用户名" autocomplete="username">
      <input id="password" type="password" placeholder="密码" autocomplete="current-password">
      <button type="button" id="loginBtn" data-i18n="login.btn">登录</button>
      <div class="hint" id="loginHint"></div>
    </div>
  </div>

  <h1><span data-i18n="title.head">沟通室 · CHAT</span>
    <select id="roomSel" class="roomsel" disabled></select><span style="flex:1"></span>
    <a href="javascript:switchLang()" id="langBtn" class="logout" title="Toggle language / 切换语言"></a>
    <a href="javascript:logout()" id="logoutBtn" class="logout" data-i18n="logout">登出</a></h1>

  <!-- 第一行：发件人 / 收件人 / 抄送（三者同宽）+ 主题 -->
  <div class="panel">
    <label class="fld"><span class="lbl" data-i18n="fld.from">发件人</span><input id="from" class="eq" type="text" autocomplete="off"></label>

function curLang(){ return (localStorage.getItem('chat_lang') === 'en') ? 'en' : 'zh'; }
function langDict(){ return I18N[curLang()] || I18N.zh; }
// t(key, ...args)：取当前语言文案，%s 依次替换；缺 key 回退中文，再缺回退 key 本身
function t(key){
  var d = langDict(), text = d[key];
  if (text === undefined) { text = I18N.zh[key]; }
  if (text === undefined) return key;
  for (var i = 1; i < arguments.length; i++) text = text.replace('%s', arguments[i]);
  return text;
}
// 窄屏判定（断点与 CSS 的媒体查询保持一致 = 640px）：移动端不提示「Ctrl/⌘+回车 发送」
var narrowMQ = window.matchMedia ? window.matchMedia('(max-width: 640px)') : { matches:false };
function applyI18n(){
  document.documentElement.lang = curLang() === 'en' ? 'en' : 'zh-CN';
  // data-i18n 文本节点
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  // 登录框占位
  username && (username.placeholder = t('login.ph.user'));
  password && (password.placeholder = t('login.ph.pwd'));
  // 输入框占位 / title
  msg.placeholder = t(narrowMQ.matches ? 'ph.msg.touch' : 'ph.msg');   // 触屏：不带 Ctrl/⌘ 提示
  if(!applyI18n._mqBound){                                  // 跨断点（横竖屏/缩放）时重刷占位；只绑一次
    applyI18n._mqBound = true;
    if(narrowMQ.addEventListener) narrowMQ.addEventListener('change', applyI18n);
    else if(narrowMQ.addListener) narrowMQ.addListener(applyI18n);   // 老 Safari 兜底
  }
  from.placeholder = t('ph.from'); to.placeholder = t('ph.to');
  subject.placeholder = t('ph.subject'); session.placeholder = t('ph.session');
  // 语言切换按钮文案 = 另一个语言
  var lb = document.getElementById('langBtn');
  if (lb) lb.textContent = t('lang.switch');
  // 房间下拉提示
  roomSel && (roomSel.title = t('room.sel'));
  noTagLbl && (noTagLbl.title = t('btn.plain.tip'));
  ccLbl && (ccLbl.title = t('fld.cc.tip'));
  histRender('to'); histRender('cc');   // 历史下拉的「清空历史」文案 / ▾ 提示 随语言切换
  toTop && (toTop.title = t('btn.totop.tip'));
  autoRefreshLbl && autoRefreshEnabled() && (autoRefreshLbl.title = t('btn.auto.tip', autoRefreshSec()));
}
function switchLang(){
  localStorage.setItem('chat_lang', curLang() === 'en' ? 'zh' : 'en');
  applyI18n();
  // 重渲染内容区，让归档/筛选条等动态文案刷新
  paint(); setHint('', '');
}

// 元数据显示本地化：en 模式下把中文标签前缀替换为英文显示（仅显示，不改写文件）。
// 老帖存的是中文标签；这里在渲染时做行首标签映射，使英文界面标签为英文（英文冒号后带空格）。
function localizeMeta(lines){
  if (curLang() !== 'en') return lines;
  var pairs = [
    ['- 时间：', '- Time: '], ['- Time:', '- Time: '],
    ['- 收件人：', '- To: '], ['- To:', '- To: '],
    ['- 抄送：', '- Cc: '], ['- Cc:', '- Cc: '],
    ['- 主题：', '- Subject: '], ['- Subject:', '- Subject: '],
    ['- 对话：', '- Conversation: '], ['- 会话：', '- Conversation: '],
    ['- Conversation:', '- Conversation: '], ['- Session:', '- Conversation: ']
  ];
  return lines.map(function(l){
    for (var i = 0; i < pairs.length; i++){
      if (l.indexOf(pairs[i][0]) === 0) return pairs[i][1] + l.slice(pairs[i][0].length);
    }
    return l;
  });
}

// 初始房间优先级：URL `?room=<名>` > localStorage 上次选中 > 空（由后端决定缺省房）
var currentRoom = (function(){
  try {
    var u = new URLSearchParams(location.search).get('room');
    if (u) return u;
  } catch (e) {}
  return localStorage.getItem('chat_room') || '';
})();
var rooms = [];
function roomQuery(){ return currentRoom ? ('?room=' + encodeURIComponent(currentRoom)) : ''; }
// 文件共享走本服务代理路由（仓库公开/私有均可，需登录 JWT）；按当前聊天室带上 ?room=
function fileHref(p){
  return '/api/chat/file/' + p.split('/').map(function(seg){ return encodeURIComponent(seg); }).join('/') +
         roomQuery();
}

var username = document.getElementById('username');
var password = document.getElementById('password');

function setToken(t){ token = t || ''; if(t) localStorage.setItem('chat_jwt', t); else localStorage.removeItem('chat_jwt'); }
function authHeaders(extra){
  var h = {'Content-Type':'application/json'};
  if(token) h['Authorization'] = 'Bearer ' + token;
  if(extra) Object.keys(extra).forEach(function(k){ h[k] = extra[k]; });
  return h;
}
function apiFetch(url, opts){
  opts = opts || {};
  opts.headers = authHeaders(opts.headers);
  return fetch(url, opts).then(function(r){
    if(r.status === 401){ showLogin(t('login.expired')); throw new Error('unauthorized'); }
    return r;
  });
}
function showLogin(msg){ if(msg) loginHint.textContent = msg; loginEl.classList.remove('hidden'); }
function hideLogin(){ loginEl.classList.add('hidden'); }
function doLogin(){
  var u = username.value.trim(), p = password.value.trim();
  if(!u || !p){ loginHint.textContent=t('login.err.required'); return; }
  fetch('/api/chat/login', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({username:u, password:p})})
    .then(function(r){ return r.json().then(function(j){ return {status:r.status, j:j}; }); })
    .then(function(res){
      if(res.status===200 && res.j && res.j.token){ setToken(res.j.token); password.value=''; hideLogin(); load(); }
      else { loginHint.textContent = (res.j && res.j.error) || t('login.err.fail'); }
    }).catch(function(e){ loginHint.textContent=t('login.err.req')+e; });
}
function logout(){ setToken(''); showLogin(t('logout.done')); }
loginBtn.addEventListener('click', doLogin);
password.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });

// ---- 「收件人 / 抄送」历史输入（2026-09-18 用户要求：保存历史输入，方便快速选择）----
// 发言成功后才记录当次的值（去重、新的在前、最多 HIST_MAX 条），存 localStorage（只在本浏览器，不上传）。
// 字段右侧的 ▾ 按钮**只在该字段有历史时出现**，点开列出最近值 → 单击即填入；底部提供「清空历史」。
var HIST_MAX = 8;
function histKey(id){ return 'chat_hist_' + id; }
function histEls(id){
  return { inp: document.getElementById(id), btn: document.getElementById(id + 'Hist'),
           menu: document.getElementById(id + 'Menu') };
}
function histLoad(id){
  try{
    var a = JSON.parse(localStorage.getItem(histKey(id)) || '[]');
    return Array.isArray(a) ? a.filter(function(x){ return typeof x === 'string' && x.trim(); }).slice(0, HIST_MAX) : [];
  }catch(e){ return []; }
}
function histPush(id, v){
  v = (v || '').trim();
  if(!v) return;                                               // 抄送留空是常态：空值不入历史
  var a = histLoad(id).filter(function(x){ return x !== v; });
  a.unshift(v);
  try{ localStorage.setItem(histKey(id), JSON.stringify(a.slice(0, HIST_MAX))); }catch(e){}
  histRender(id);
}
function histClear(id){
  try{ localStorage.removeItem(histKey(id)); }catch(e){}
  histRender(id);
}
function histClose(id){
  var e = histEls(id);
  if(!e.menu) return;
  e.menu.hidden = true;
  e.btn.setAttribute('aria-expanded', 'false');
}
function histCloseAll(){ ['to','cc'].forEach(histClose); }
function histRender(id){
  var e = histEls(id);
  if(!e.menu) return;
  var a = histLoad(id);
  if(e.btn) e.btn.title = t('hist.tip');
  if(e.btn) e.btn.classList.toggle('on', a.length > 0);         // 无历史 ⇒ 不显示 ▾（不占位）
  e.menu.innerHTML = '';
  if(!a.length){ histClose(id); return; }
  a.forEach(function(v){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'hi'; b.textContent = v; b.title = v;
    b.addEventListener('click', function(){ e.inp.value = v; histClose(id); });
    e.menu.appendChild(b);
  });
  var c = document.createElement('button');
  c.type = 'button'; c.className = 'hi clr'; c.textContent = t('hist.clear');
  c.addEventListener('click', function(){ histClear(id); });
  e.menu.appendChild(c);
}
// ---- 「收件人」从 CHAT.md 的发言用户中选（2026-09-20 用户要求，**可多选**）----
// 名单**就地取**自页面已解析的块（`allParsed()` ⇒ `blocks[].speaker`），**不新增后端接口**，
// 也不读归档（读法口径：只读 CHAT.md）。与 ▾「历史输入」并存：▾ = 最近用过的值，👥 = 本房出现过的发言人。
// 多值写法遵循技能口径：**`+` 分隔**；「所有人」与具体人**互斥**（选中具体人即自动去掉「所有人」）。
// ⚠️ `所有人` 是**写入内容**（`- 收件人：所有人`），不随界面语言变 ⇒ 用常量，不用 t()（英文态也写「所有人」）。
var PICK_ALL = '所有人';
var PICK_SEP = '+';
function pickEls(){
  return { inp: document.getElementById('to'), btn: document.getElementById('toPick'),
           menu: document.getElementById('toPickMenu') };
}
function pickNames(){
  var blocks = [];
  try { blocks = (allParsed() || {}).blocks || []; } catch (e) { blocks = []; }
  var seen = {}, out = [];
  blocks.forEach(function(b){
    var s = String((b && b.speaker) || '').trim();
    if(!s || seen[s]) return;
    seen[s] = 1; out.push(s);                       // blocks 已是「新 → 旧」⇒ 名单按最近发言在前
  });
  return out;
}
function pickSplit(v){
  return String(v || '').split(/[+＋,，、]/).map(function(x){ return x.trim(); }).filter(Boolean);
}
function pickClose(){
  var e = pickEls();
  if(e.menu) e.menu.hidden = true;
  if(e.btn) e.btn.setAttribute('aria-expanded', 'false');
}
function pickRender(){
  var e = pickEls();
  if(!e.menu || !e.btn || !e.inp) return;
  var names = pickNames();
  e.btn.classList.toggle('on', names.length > 0);   // 无发言人 ⇒ 不显示（不占位）
  if(!names.length){ pickClose(); return; }
  e.btn.title = t('pick.tip');
  var cur = pickSplit(e.inp.value), allOnly = (cur.length === 1 && cur[0] === PICK_ALL);
  e.menu.innerHTML = '';
  function row(name, isAll){
    var line = document.createElement('div');       // ⚠️ 不用 <label>：外层 .fld 本身就是 label，嵌套会有歧义
    line.className = 'hi pick';
    line.setAttribute('data-name', name);           // pickSync 就地同步勾选态用
    if(isAll) line.setAttribute('data-all', '1');
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = isAll ? allOnly : (!allOnly && cur.indexOf(name) >= 0);
    var txt = document.createElement('span');
    txt.textContent = name; txt.title = name;
    line.appendChild(cb); line.appendChild(txt);
    cb.addEventListener('change', function(){
      if(isAll){ e.inp.value = cb.checked ? PICK_ALL : ''; }
      else {
        var rest = pickSplit(e.inp.value).filter(function(x){ return x !== PICK_ALL; });
        if(cb.checked){ if(rest.indexOf(name) < 0) rest.push(name); }
        else { rest = rest.filter(function(x){ return x !== name; }); }
        e.inp.value = rest.join(PICK_SEP);
      }
      pickSync();                                   // ⚠️ 只就地同步勾选态，**不能重建菜单**：
                                                    // 重建会把本次点击的节点 detach ⇒ 文档级 click 的 `closest('.panel .fld')` 得 null
                                                    // ⇒ 被误判成「点在外面」而收起菜单（多选根本用不了）。
    });
    line.addEventListener('click', function(ev){
      if(ev.target === cb) return;
      cb.checked = !cb.checked;
      cb.dispatchEvent(new Event('change'));
    });
    e.menu.appendChild(line);
  }
  row(t('pick.all'), true);
  names.forEach(function(n){ row(n, false); });
  var c = document.createElement('button');
  c.type = 'button'; c.className = 'hi clr'; c.textContent = t('pick.clear');
  c.addEventListener('click', function(){ e.inp.value = ''; pickSync(); });
  e.menu.appendChild(c);
}
// 就地同步各行的勾选态（不重建 DOM）—— 见 row() 里 change 的注释：重建会 detach 目标、让菜单被误收起。
function pickSync(){
  var e = pickEls();
  if(!e.menu) return;
  var cur = pickSplit(e.inp.value), allOnly = (cur.length === 1 && cur[0] === PICK_ALL);
  Array.prototype.forEach.call(e.menu.querySelectorAll('.hi.pick'), function(line){
    var cb = line.querySelector('input');
    if(!cb) return;
    var isAll = line.getAttribute('data-all') === '1';
    var nm = line.getAttribute('data-name') || '';
    cb.checked = isAll ? allOnly : (!allOnly && cur.indexOf(nm) >= 0);
  });
}
['to','cc'].forEach(function(id){
  var e = histEls(id);
  if(!e.btn) return;
  e.btn.addEventListener('click', function(){
    var wasOpen = !e.menu.hidden;
    histCloseAll(); pickClose();                    // 两个菜单同时只开一个
    if(!wasOpen){ e.menu.hidden = false; e.btn.setAttribute('aria-expanded', 'true'); }
  });
});
(function(){
  var e = pickEls();
  if(!e.btn || !e.menu) return;
  e.btn.addEventListener('click', function(){
    var wasOpen = !e.menu.hidden;
    histCloseAll(); pickClose();
    if(!wasOpen){ pickRender(); e.menu.hidden = false; e.btn.setAttribute('aria-expanded', 'true'); }
  });
  if(e.inp) e.inp.addEventListener('input', pickSync);   // 手输/粘贴 收件人 时同步勾选态
})();
// 点字段/菜单之外、或按 Esc ⇒ 收起（同时只开一个）
document.addEventListener('click', function(ev){
  if(ev.target && ev.target.closest && ev.target.closest('.panel .fld')) return;
  histCloseAll(); pickClose();
});
document.addEventListener('keydown', function(ev){ if(ev.key === 'Escape'){ histCloseAll(); pickClose(); } });
histRender('to'); histRender('cc'); pickRender();

// 用后端返回的聊天室列表渲染下拉框；选中项缺失时回退到首个聊天室。
function renderRooms(list, cur){
  rooms = list || [];
  roomSel.innerHTML = '';
  if (!rooms.length){ roomSel.disabled = true; return; }
  roomSel.disabled = false;
  rooms.forEach(function(r){
    var o = document.createElement('option');
    o.value = r.id;
    o.textContent = r.name || r.id;   // 展示名（配置 rooms[].name；缺省为 id）
    roomSel.appendChild(o);
  });
  var ok = rooms.some(function(r){ return r.id === cur; });
  if (!ok && rooms.length) cur = rooms[0].id;
  roomSel.value = cur;
  currentRoom = cur;
  localStorage.setItem('chat_room', cur);
  applyReadOnly();                    // 只读房间：隐藏输入表单（服务端同样拒绝发言）
  // 把「后端实际解析出的房间」（含缺省房 / 选中项缺失时的回退）也同步进 URL，
  // 保留 hash（首次带 `#no-N` 深链进来时要留住它）。
  syncUrl(true);
}
// 只读房间（后端 rooms[].show_input_form=false）⇒ 隐藏三个输入面板 + 移动端「写发言」按钮，
// 并在原提示位说明原因。注意服务端也会拒绝该房的 /api/chat/speak（见 main 的 SpeakHTTP），
// 这里只是把「不允许」在界面上表达出来，不是唯一防线。
function applyReadOnly(){
  var cur = null;
  for (var i = 0; i < rooms.length; i++){ if (rooms[i].id === currentRoom){ cur = rooms[i]; break; } }
  var allowed = !cur || cur.show_input_form !== false;   // 缺省允许
  var disp = allowed ? '' : 'none';
  var ps = document.querySelectorAll('.panel');
  for (var j = 0; j < ps.length; j++) ps[j].style.display = disp;
  var tt = document.getElementById('toTop');
  if (tt) tt.style.display = disp;
  // 用独立的 #readonlyHint：#hint 由「已读取…」占用，写它会被后续请求覆盖
  var ro = document.getElementById('readonlyHint');
  if (ro) ro.textContent = allowed ? '' : t('room.readonly');
}

// 下拉切换聊天室 → 重新读取该聊天室内容
roomSel.addEventListener('change', function(){
  if (roomSel.value === currentRoom) return;
  currentRoom = roomSel.value;
  localStorage.setItem('chat_room', currentRoom);
  syncUrl(false);          // 房间已变：URL 跟上，并丢掉旧房间的 #no-N 锚点
  load();
});

// ── URL ↔ 房间同步【2026-09-17 修】──────────────────────────────────────────────
// 症状：下拉切换房间后，URL 里的 `?room=` 从不更新；而 `?room=` 又**优先于** localStorage，
//   于是「切换房间 → 点 ReNo」只会给地址栏加个 `#no-N`、room 仍是旧值
//   ⇒ 刷新 / 分享 / 复制链接都会落回**旧房间**（用户报：「只改变 no 锚点，room 未变」）。
// 规则：currentRoom 一变就把 URL 同步过去；用 replaceState **不刷历史**（切房不进后退栈）；
//   切房时清掉旧锚点（那个 `#no-N` 属于旧房间的内容，留着无意义且会误导）。
function syncUrl(keepHash){
  try {
    var q = currentRoom ? ('?room=' + encodeURIComponent(currentRoom)) : '';
    history.replaceState(null, '', location.pathname + q + (keepHash ? location.hash : ''));
  } catch (e) { /* 个别环境禁用 history（如 file://）→ 静默忽略 */ }
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// 行内标记 → HTML。步骤：① 抽出代码跨度（占位符）② 整体转义并套用行内规则 ③ 占位符还原为 <code>
// 代码跨度按「反引号连续个数精确配对」处理 —— 这样 `` `#44` `` 这类「用双反引号包住单个反引号」
// 的写法不会错配（2026-09-15 实测：简单正则 /`([^`]+)`/ 会把本房间的 `` `#44` `` 配成半个标签）。
// 裸 URL / <URL> 自动成链（2026-09-17 用户要求：让发言里的链接可跳转）。
// 只处理**纯文本里的 URL**：已是 <a> 的片段原样放行（避免二次包裹）；代码跨度不受影响
// （inline() 里先抽代码为占位符，此时尚未还原）。
function linkify(html){
  return html.replace(/(<a\b[^>]*>[\s\S]*?<\/a>)|(?:&lt;|<)(https?:\/\/[^>&\s]+)(?:&gt;|>)|([\s(（，、；：]|^)(https?:\/\/[^\s<>"'）)，、；：！？。…」』】]+)/g,
    function(m, a, ang, pre, bare){
      if (a) return a;                                   // 已是链接：别动
      if (ang) return '<a href="' + ang + '" target="_blank" rel="noopener">' + ang + '</a>';
      var tail = '', u = bare, t = /[.,;:!?]+$/.exec(u);
      if (t){ tail = t[0]; u = u.slice(0, -tail.length); }  // 句末标点不并入 URL
      return pre + '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>' + tail;
    });
}

function inline(s){
  s = String(s);
  var codes = [], work = '', i = 0;
  while (i < s.length){
    if (s[i] === '`'){
      var n = 0;
      while (s[i + n] === '`') n++;
      var open = s.substr(i, n), close = s.indexOf(open, i + n);
      while (close >= 0 && s[close + n] === '`') close = s.indexOf(open, close + 1); // 收尾须恰好 n 个
      if (close < 0){ work += s.slice(i); break; }                                  // 未闭合：原样保留
      codes.push(s.slice(i + n, close));
      work += '\u0000' + (codes.length - 1) + '\u0000';
      i = close + n;
    } else {
      var j = s.indexOf('`', i);
      if (j < 0) j = s.length;
      work += s.slice(i, j);
      i = j;
    }
  }
  var out = esc(work)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(_, t, u){
      var href;
      if (/^https?:/i.test(u)) {                         // 外链：原样
        href = u;
      } else {
        // 站内文件（相对路径或 file://）→ 走本服务代理路由（fileHref，仓库内相对路径；仓库私有也能访问）
        var p = u.replace(/^file:\/\//i, '');
        var mark = currentRoom ? (currentRoom + '/') : '';
        if (mark && p.indexOf(mark) >= 0) p = p.slice(p.indexOf(mark) + mark.length);   // 绝对 file:// 路径：取仓库内相对路径
        // 其余（不含当前仓库名标记）保持原样，即为「仓库根起的相对路径」，不可截断为文件名
        href = fileHref(p);
      }
      return '<a href="' + href + '" target="_blank" rel="noopener">' + t + '</a>';
    })
    .replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>')
    .replace(/~~([\s\S]+?)~~/g, '<del>$1</del>');
  out = linkify(out);                       // 裸 URL / <URL> → 可点链接
  return out.replace(/\u0000(\d+)\u0000/g, function(_, k){
    return '<code>' + esc(codes[+k]) + '</code>';
  });
}
function setHint(t, cls){ hint.textContent=t; hint.className='hint '+(cls||''); }
// busy：历史视图下发言恒禁用（只读）—— 否则 load() 末尾的 busy(false) 会把禁用态解掉
function busy(on){ speakBtn.disabled = on || !!historyName; updateBtn.disabled = on; }

// CHAT.md → HTML（自包含迷你 Markdown：标题 / 表格 / 列表 / 引用 / 代码块 / 分隔线 + 行内标记）。
// 链接：`[文本](url)`、`<url>`、裸 `https://…` 都会渲染成可点链接（后两者由 linkify() 处理）。
// 为什么不用 CDN 的 marked.js：聊天室是全自包含静态页（无外链依赖）。
function render(md){
  var lines = String(md).replace(/\r\n?/g, '\n').split('\n');
  var out = [], i = 0;

  // 表格分隔行：GFM 只要求每格 ≥1 个横线（`|-|`、`|:-:|` 合法）—— 原先写死 -{2,}
  // ⇒ `|:-:|:---|:---|:---|` 这种「居中列只用 1 个横线」的表**判不出来**，整张表被当普通段落逐行输出
  //（2026-09-18 用户报 No.205「小结」表格没渲染，根因即此）。放宽为 -+ 后与 GFM 一致。
  function isSep(s){ return /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(s); }
  function cells(s){ return s.trim().replace(/^\|/, '').replace(/\|$/, '').split('|')
                            .map(function(c){ return c.trim(); }); }
  function isBlockStart(s){
    return /^\s*```/.test(s) || /^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(s) || /^#{1,6}\s/.test(s) ||
           /^\s*>/.test(s) || /^\s*([-*+]|\d+\.)\s+/.test(s) ||
           (s.indexOf('|') >= 0 && i + 1 < lines.length && isSep(lines[i + 1]));
  }
  function list(items, ordered){
    var tag = ordered ? 'ol' : 'ul', h = '<' + tag + '>', lvl = 0;
    items.forEach(function(it){
      if (it.lvl > lvl){ h += '<' + tag + '>'; lvl = it.lvl; }
      else if (it.lvl < lvl){ h += '</' + tag + '>'; lvl = it.lvl; }
      h += '<li>' + inline(it.text) + '</li>';
    });
    while (lvl-- > 0) h += '</' + tag + '>';
    return h + '</' + tag + '>';
  }

  while (i < lines.length){
    var line = lines[i], m;

    if (/^\s*```/.test(line)){                                    // 代码块
      var lang = line.replace(/^\s*```/, '').trim(), buf = [];
      for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) buf.push(lines[i]);
      i++;
      out.push('<pre' + (lang ? ' data-lang="' + esc(lang) + '"' : '') + '><code>' +
               esc(buf.join('\n')) + '</code></pre>');
      continue;
    }
    if (!line.trim()){ i++; continue; }                            // 空行
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){ out.push('<hr>'); i++; continue; }

    m = /^(#{1,6})\s+(.*)$/.exec(line);                            // 标题（降一级：正文 h1 → h2）
    if (m){ var lv = Math.min(m[1].length + 1, 6);
            out.push('<h' + lv + '>' + inline(m[2]) + '</h' + lv + '>'); i++; continue; }

    if (line.indexOf('|') >= 0 && i + 1 < lines.length && isSep(lines[i + 1])){   // 表格
      var head = cells(line);
      i += 2;
      var body = [];
      while (i < lines.length && lines[i].trim() && lines[i].indexOf('|') >= 0){
        body.push(cells(lines[i])); i++;
      }
      var t = '<table><thead><tr>' +
              head.map(function(c){ return '<th>' + inline(c) + '</th>'; }).join('') +
              '</tr></thead><tbody>';
      body.forEach(function(r){
        t += '<tr>';
        for (var k = 0; k < head.length; k++){
          t += '<td>' + inline(r[k] === undefined ? '' : r[k]) + '</td>';
        }
        t += '</tr>';
      });
      out.push(t + '</tbody></table>');
      continue;
    }
    if (/^\s*>/.test(line)){                                       // 引用（递归渲染内含块）
      var q = [];
      while (i < lines.length && /^\s*>/.test(lines[i])){
        q.push(lines[i].replace(/^\s*>\s?/, '')); i++;
      }
      out.push('<blockquote>' + render(q.join('\n')) + '</blockquote>');
      continue;
    }
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)){                        // 列表（缩进 ≥2 空格视为一级嵌套）
      var ordered = /^\s*\d+\.\s+/.test(line), items = [];
      while (i < lines.length){
        m = /^(\s*)([-*+]|\d+\.)\s+(.*)$/.exec(lines[i]);
        if (!m) break;
        items.push({ lvl: m[1].replace(/\t/g, '    ').length >= 2 ? 1 : 0, text: m[3] });
        i++;
      }
      out.push(list(items, ordered));
      continue;
    }
    var p = [];                                                    // 段落
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])){ p.push(lines[i]); i++; }
    if (!p.length){ p.push(lines[i]); i++; }                       // 兜底：绝不空转
    out.push('<p>' + p.map(inline).join('<br>') + '</p>');
  }
  return out.join('\n');
}

var rawMd = '';        // 最近一次的 CHAT.md 原文
var filterTag = '';    // 「只看某会话」的标签（'' = 全部）
var closedTags = {};   // 已结束（End）的标签 —— 按规则不可再引用
var lastAutoTag = '', lastAutoReply = '', lastAutoTo = '';   // 上次自动回填的缺省值（避免覆盖用户手输）
// 「不带Tag」模式（2026-09-17 用户定）：本条**不带对话 Tag** ⇒ 服务端不写「对话：」行。
// · **默认选中**（安全默认：不声不响地继承上一条的对话是危险的）
// · 与「创建Tag」「结束Tag」**三态互斥**（同款勾选样式）（勾选那两者会取消它；它开启时会清空 Tag/ReNo）
// · **点某条发言的标题会自动取消**（转为「回复该条」，并填好 Tag/ReNo）
// · 开启期间 applyDefault 不回填 Tag/ReNo（刷新/重绘后保持空）
var plainPost = true;
function syncPlainChk(){ if (noTagBox) noTagBox.checked = plainPost; }
function setPlainPost(on){
  plainPost = !!on;
  if (plainPost){ createTag.checked = false; endTag.checked = false; session.value = ''; reply.value = ''; syncTagInputs(); }
  syncPlainChk(); warnTag();
}
function selfSpeaker(){ return from.value.trim(); }   // 当前发言人 = 填写的「发件人」（必填，无缺省）

// ---- 发言块与会话字段解析（规则见聊天室仓库 README 核心规则 8）----
// 发言块判定：`^# ` 行且其下 1~3 个非空行内出现 `- 时间：`（代码围栏内不算）。
// 字段只在**块头元数据区**取（标题行之后、首个空行之前的 `- x：` 行）——正文里的同名文本不算。
function parseChat(md){
  var lines = String(md).replace(/\r\n?/g, '\n').split('\n');
  var starts = [], inCode = false, i, k;
  for (i = 0; i < lines.length; i++){
    if (/^\s*```/.test(lines[i])){ inCode = !inCode; continue; }
    if (inCode || !/^# /.test(lines[i])) continue;
    var nb = [];
    for (k = i + 1; k < lines.length && nb.length < 3; k++){ if (lines[k].trim()) nb.push(lines[k]); }
    if (nb.some(function(l){ return /^- (时间：|Time:)/.test(l); })) starts.push(i);
  }
  var pre = lines.slice(0, starts.length ? starts[0] : lines.length).join('\n');
  var blocks = [];
  starts.forEach(function(s, n){
    var seg = lines.slice(s, (n + 1 < starts.length) ? starts[n + 1] : lines.length);
    var title = seg[0], meta = [], j = 1;
    while (j < seg.length && !seg[j].trim()) j++;                        // 标题与元数据之间有空行
    while (j < seg.length && /^- /.test(seg[j].trim())){ meta.push(seg[j].trim()); j++; }
    var body = seg.slice(j).join('\n').replace(/\n+---\s*\n?$/, '\n').trim();   // 去掉块尾分隔线
    var t = /^#\s+(.*?)\s*No\.(\d+)\s*$/.exec(title);
    var b = { no: t ? 'No.' + t[2] : '', speaker: t ? t[1] : title.replace(/^#\s+/, ''),
              tag: '', tagEnd: false, reply: '', metaLines: [], body: body };
    meta.forEach(function(line){
      // 会话元数据行：中文「对话：/会话：」或英文「Conversation:/Session:」
      var conv = null;
      var mC = /^- Conversation:\s*(.*)$/.exec(line) || /^- Session:\s*(.*)$/.exec(line);
      if (mC){ conv = mC[1]; }
      else {
        var m = /^- ([^：]+)：(.*)$/.exec(line);
        if (m && (m[1] === '对话' || m[1] === '会话')){ conv = m[2]; }
      }
      if (conv != null){
        // 对话字段语法（2026-09-17 统一）：NewTag:<短名> / Tag:<短名>[ ReNo:<n>] / EndTag:<短名>
        // 旧写法（Tag.<短名> / End: Tag.<短名> / Re: No.<n>）一律兼容；内部规范 key 仍是 Tag.<短名>。
        var val = conv.trim();
        if (/^EndTag:/.test(val)){ b.tagEnd = true; val = val.slice(7).trim(); }
        else if (/^End:/.test(val)){ b.tagEnd = true; val = val.slice(4).trim(); }
        if (/^NewTag:/.test(val)){ val = val.slice(7).trim(); }   // 过渡写法：等同 Tag:
        else if (/^Tag:/.test(val)){ val = val.slice(4).trim(); }
        var r = /(?:ReNo[:.]|Re:\s*No\.)(\d+)/.exec(val);   // 新 ReNo:<n> / 旧的 ReNo.<n> / 更旧的 Re: No.<n>
        if (r){ b.reply = 'No.' + r[1]; val = val.slice(0, r.index).trim(); }
        b.tag = val ? (/^Tag\./.test(val) ? val : ('Tag.' + val)) : '';
        return;
      }
      b.metaLines.push(line);                           // 其余元数据**原样保留**（逐行渲染）
    });
    blocks.push(b);
  });
  return { pre: pre, blocks: blocks };
}

function anchorOf(no){ return no ? no.toLowerCase().replace(/[^a-z0-9]+/g, '-') : ''; }

function blockHtml(b){
  var closedCls = (b.tag && closedTags[b.tag]) ? ' blk-closed' : '';
  var h = ['<section class="blk' + (b.tagEnd ? ' blk-end' : closedCls) + '"' +
           (b.no ? ' id="' + anchorOf(b.no) + '"' : '') + '>'];
  h.push('<div class="blk-title"' +
         (b.no ? ' data-no="' + esc(b.no) + '"' : '') +
         ' data-speaker="' + esc(b.speaker) + '"' +
         (b.tag ? ' data-tag="' + esc(b.tag) + '"' : '') +
         ' title="' + esc(t('tb.fill')) + '">');
  if (b.no) h.push('<span class="no">' + esc(b.no) + '</span>');
  h.push('<span class="who">' + esc(b.speaker) + '</span>');
  if (b.tag){
    h.push('<span class="tag' + (b.tagEnd ? ' tag-end' : '') + '" data-tag="' + esc(b.tag) +
           '" title="' + esc(t('tg.click')) + '">' + esc(tagBadge(b)) + '</span>');
  }
  if (b.reply) h.push('<a class="re" href="#' + anchorOf(b.reply) + '" title="' + esc(b.reply) + '">'
                      + esc(reLabel(b.reply)) + '</a>');
  h.push('</div>');
  // 元数据**按原始格式逐行**渲染（`- 时间：/ - 收件人：/ - 主题：` 各占一行）；
  // `- 对话：` 行由标题徽标表达，不在这里重复（2026-09-15 用户明确：元数据保持原样）。
  if (b.metaLines.length) h.push('<div class="blk-meta">' + render(localizeMeta(b.metaLines).join('\n')) + '</div>');
  h.push('<div class="blk-body">' + render(b.body) + '</div>');
  h.push('</section>');
  return h.join('');
}

// 会话信息由每条标题上的**徽标**表达（同一对话的发言带同一徽标）——不再另插分隔带：
// 分隔带与徽标内容重复，2026-09-15 用户明确去掉。
// 沟通室规则已移入本仓库 README.md（规则给 Agent 看，2026-09-17 用户定：页面不再显示）。
// opts: {skipHead: 不渲染文件抬头（归档段用）; noFilterBar: 不重复渲染筛选条; filterCount: 覆盖筛选计数}
function renderChat(md, filter, opts){
  opts = opts || {};
  var p = parseChat(md);
  if (!p.blocks.length) return opts.skipHead ? '' : '';
  var out = [];
  if (filter && !opts.noFilterBar){
    var n = (typeof opts.filterCount === 'number') ? opts.filterCount
            : p.blocks.filter(function(b){ return b.tag === filter; }).length;
    out.push('<div class="filterbar">' + t('hf.onlytag','<code>'+esc(tagLabel(filter))+'</code>', n) +
             '<button type="button" id="clearFilter">' + t('hf.clearing') + '</button></div>');
  }
  p.blocks.forEach(function(b){
    if (filter && b.tag !== filter) return;
    out.push(blockHtml(b));
  });
  return out.join('\n');
}

// 当前仍在讨论中的会话 = 最近一条带标签、且该标签未被 End 的块（规则 8「一次只讨论一个主题」）
function openTopic(p){
  var latest = -1, tag = '';
  p.blocks.forEach(function(b){
    if (!b.tag || !b.no) return;
    var n = parseInt(b.no.slice(3), 10);
    if (n > latest){ latest = n; tag = b.tag; }
  });
  return (tag && !closedTags[tag]) ? tag : '';
}

// 会话发起人 = 最早带该标签那一条的发言人（规则 8：只有发起人可以 End）
function tagOwner(p, tag){
  var owner = '', best = -1;
  p.blocks.forEach(function(b){
    if (b.tag !== tag || !b.no) return;
    var n = parseInt(b.no.slice(3), 10);
    if (best < 0 || n < best){ best = n; owner = b.speaker; }
  });
  return owner;
}

// 把「53 / No.53 / Re: No.53」统一成 No.<n>（取不到数字返回 ''）
function reNo(v){
  var m = /(\d+)/.exec(String(v == null ? '' : v));
  return m ? ('No.' + m[1]) : '';
}

// Tag 输入：**只填短名**（无需 `Tag.` 前缀，如 cup-quota-0917）。
// bareTag() 归一为短名（顺带吃掉 `End:` 前缀与误输入的 `Tag.`）；fullTag() 补回规范形式 Tag.<短名>。
function bareTag(v){
  return String(v == null ? '' : v).trim()
         .replace(/^EndTag:\s*/i, '').replace(/^End:\s*/i, '')
         .replace(/^NewTag:\s*/i, '').replace(/^Tag[:.]\s*/i, '')
         .replace(/^#/, '').trim();
}
function fullTag(v){ var b = bareTag(v); return b ? ('Tag.' + b) : ''; }

// Tag 的**显示**文案：`Tag.<短名>` → `Tag:<短名>`（2026-09-17 用户定；配合 reLabel() 读作
// 「对话：Tag:<短名> ReNo:<编号>」。已统一到全部显示位置：标题徽标 / 筛选条 / 各类提示文案）。
// ⚠️ 纯显示层，两条铁律：
//   ① 凡是**比较 / 存储 / 提交**（closedTags 判定、tagOwner、filterTag、data-tag、提交给服务端）
//      一律用规范形式 `Tag.<短名>`；
//   ② 凡是**给人看**的文本，一律套 tagLabel()。
//   ⇒ 渲染出的 `#` 只在 HTML 文本节点里，CHAT.md 一字不动。
function tagLabel(v){ var b = bareTag(v); return b ? ('Tag:' + b) : ''; }
function endTagLabel(v){ var b = bareTag(v); return b ? ('EndTag:' + b) : ''; }

// 标题行徽标（2026-09-17 定稿语法）：Tag:<短名> / EndTag:<短名>
function tagBadge(b){
  var s = bareTag(b.tag); if (!s) return '';
  return (b.tagEnd ? 'EndTag:' : 'Tag:') + s;
}

// 回应编号的**显示**文案：`No.144` → `ReNo:144`（2026-09-17 用户定，与 No.<n> 同形；
// 与 Tag: 一起读作「对话：Tag:xxx ReNo:144」）。文件里同样是 `ReNo:<n>`。
function reLabel(v){
  var m = /(\d+)/.exec(String(v == null ? '' : v));
  return m ? ('ReNo:' + m[1]) : '';
}

// 缺省值（规则 8）：主题还在讨论中 ⇒「当前会话 + 回应上一条」；上一个主题已 End ⇒ 留空待填新标签
function applyDefault(p){
  var open = openTopic(p), maxNo = 0;
  p.blocks.forEach(function(b){ if (b.no) maxNo = Math.max(maxNo, parseInt(b.no.slice(3), 10)); });
  // UI 规则（2026-09-17 用户定）：Tag / 回复No. 的默认值 = **上一条发言**（最新一条）的 Tag / No.；没有就留空。
  var last = p.blocks.length ? p.blocks[0] : null;
  var dTag = last ? bareTag(last.tag) : '', dReply = (last && last.no) ? last.no.slice(3) : '';
  if (!plainPost){   // 普通发言模式：Tag/ReNo 保持空（不被默认值回填）
    if (!createTag.checked && (session.value.trim() === '' || session.value.trim() === lastAutoTag)) session.value = dTag;
    if (reply.value.trim() === '' || reply.value.trim() === lastAutoReply) reply.value = dReply;
  }
  lastAutoTag = dTag;
  lastAutoReply = dReply;

  // 收件人默认＝最近一条消息的作者（便于直接回复上一个人）；
  // 若最近一条是本人发的，则保持空（占位「所有人」），避免「回复自己」。
  var lastSpeaker = p.blocks.length ? p.blocks[0].speaker : '';
  var dTo = (lastSpeaker && lastSpeaker !== selfSpeaker()) ? lastSpeaker : '';
  if (to.value.trim() === '' || to.value.trim() === lastAutoTo) to.value = dTo;
  lastAutoTo = dTo;

  // Re: 编号占位提示＝当前最新一条的编号（不再写死 53）；无发言时退化为「编号」
  reply.placeholder = maxNo ? String(maxNo) : t('ph.reply');
}

// 只解析 `CHAT.md`（2026-09-19 用户定：页面只读 CHAT.md —— 主文件保底 ≥100 条 ⇒ 不再拼接归档）。
// 与后端一致（`parseBlocks` 亦只读主文件）：取号 / 会话 End 状态 / 回应目标都基于主文件。
function allParsed(){
  var a = parseChat(rawMd);
  return { pre: a.pre, blocks: a.blocks };
}

function paint(){
  var p = allParsed(), ended = {}, seen = {}, opts = [];
  p.blocks.forEach(function(b){ if (b.tag && b.tagEnd) ended[b.tag] = 1; });
  closedTags = ended;
  p.blocks.forEach(function(b){                        // 下拉里只给「未结束」的标签
    if (!b.tag || ended[b.tag] || seen[b.tag]) return;
    seen[b.tag] = 1;
    opts.push('<option value="' + esc(bareTag(b.tag)) + '"></option>');
  });
  taglist.innerHTML = opts.join('');
  var fTotal = filterTag ? p.blocks.filter(function(b){ return b.tag === filterTag; }).length : 0;
  box.innerHTML = renderChat(rawMd, filterTag, { filterCount: fTotal });
  applyDefault(p);
  pickRender();                     // 每次重绘后刷新「收件人 → 发言用户」名单（房间切换 / 新发言后）
}

function warnTag(){
  var v = fullTag(session.value);      // 输入框是短名，比较/提示一律用规范形式 Tag.<短名>
  var p = allParsed(), open = openTopic(p), r = reNo(reply.value);
  var knownTags = {};                  // 该 Tag 是否已存在
  p.blocks.forEach(function(b){ if (b.tag) knownTags[b.tag] = 1; });

  // 普通发言（不带对话 Tag）：无需 Tag/ReNo ⇒ 放行（服务端 session/reply 为空时不写「对话：」行）
  if (plainPost && !createTag.checked && !endTag.checked){ setHint(t('warn.plain'), 'ok'); return; }
  // 结束行为：Tag 为空 ⇒ 提示点击某条发言的标题，选择要结束的对话
  if (endTag.checked){
    if (!v){ setHint(t('warn.end.needtag'), 'err'); return; }
    var owner = tagOwner(p, v);
    if (owner && owner !== selfSpeaker()){
      setHint(t('warn.end.notowner', tagLabel(v), owner), 'err');
      return;
    }
    if (!knownTags[v]){ setHint(t('warn.end.never', tagLabel(v)), 'err'); return; }
    setHint(t('warn.end.willwrite', endTagLabel(v), r ? t('warn.into.re', r) : ''), '');
    return;
  }
  // 创建行为：必须带 Tag，且该短名不能已存在
  if (createTag.checked){
    if (!v){ setHint(t('warn.create.needtag'), 'err'); return; }
    if (knownTags[v]){ setHint(t('warn.create.exists', tagLabel(v)), 'err'); return; }
    setHint(t('warn.create.willwrite', tagLabel(v)), '');
    return;
  }
  // 回复行为：必须带回应编号（不再允许只带 Tag 的自由发言）
  if (v && closedTags[v]){
    setHint(t('warn.closed', tagLabel(v)), 'err'); return;
  }
  var others = [];
  p.blocks.forEach(function(b){
    if (b.tag && !closedTags[b.tag] && b.tag !== v && others.indexOf(b.tag) < 0) others.push(b.tag);
  });
  if (v && others.length){
    setHint(t('warn.openothers', others.map(tagLabel).join(t('sep.list'))), 'err'); return;
  }
  if (v && !r){ setHint(t('warn.reply.needno'), 'err'); return; }
  if (v){ setHint(t('warn.into', tagLabel(v), r ? t('warn.into.re', r) : ''), ''); return; }
  if (open){ setHint(t('warn.noopen.default', tagLabel(open)), 'err'); return; }
  setHint(t('warn.noopen'), '');
}

// 深链跳转：`?room=X#no-N` 打开 / 刷新后要**真的滚到**那条发言 ——
// 内容是异步 innerHTML 插入的，浏览器不会为「后插入的元素」自动重试锚点跳转，故显式滚一次。
// 目标不在当前显示范围（更早的归档未加载）时给出明确提示，而不是「点了没反应」。
var lastHashScrolled = '';   // 同一锚点只自动滚一次（否则每次发言/刷新都会跳回老位置）
function scrollToHash(){
  var h = (location.hash || '').replace(/^#/, '');
  if (!h || h === lastHashScrolled) return;
  lastHashScrolled = h;
  var el = document.getElementById(h);
  if (el && el.scrollIntoView) { el.scrollIntoView({block: 'start'}); return; }
  setHint(t('hint.anchor.none', 'No.' + h.replace(/^no-/, '')), 'err');
}

function show(content, note, hist){
  rawMd = content;
  historyName = hist || '';
  paint();
  paintHist();
  // ⚠️ 顺序：先出「已读取…」的常规提示，再跑深链跳转 —— 否则「找不到该编号」的提示会被它覆盖
  if(note) setHint(note, 'ok');
  scrollToHash();
}

// 历史视图状态：提示条 + 「回到最新」按钮 + 只读（禁发言）
function paintHist(){
  if (histNote) histNote.textContent = historyName ? t('hist.bar', historyName) : '';
  if (histBack) histBack.hidden = !historyName;
  if (msg) msg.disabled = !!historyName;
  if (speakBtn) speakBtn.disabled = !!historyName;
}

// 点会话徽标 = 只看该会话；点「取消筛选」恢复全部
box.addEventListener('click', function(e){
  // ⚠️ 事件目标**不能**叫 t：`t` 是 i18n 的翻译函数，`var t` 会在本函数内遮蔽它，
  // 使下面的 `t('fld.fillnote', …)` 变成「对事件对象调用」⇒ 抛 `t is not a function`，
  // 于是**填充表单的代码整段不执行**（2026-09-17 实测：点标题条只报错、收件人/Tag/ReNo 不动）。
  var tgt = e.target;
  if (tgt && tgt.id === 'clearFilter'){ filterTag = ''; paint(); return; }
  var el = (tgt && tgt.closest) ? tgt.closest('.tag') : null;
  if (el){
    var v = el.getAttribute('data-tag');
    filterTag = (filterTag === v) ? '' : v;
    paint();
    return;
  }
  // 点 ReNo 链接（href="#no-N"）= 跳到被回应的那条发言。
  // 显式滚动：hash 已是目标时浏览器不会再滚（连点同一条会「没反应」）。
  // ⚠️ 不能 return：a.re 在 .blk-title 内，点它**仍然要**触发下面的「填回复表单」行为
  //（原有行为保留，本次只**新增**「一定滚到位 + 找不到时提示」）。
  var missingRe = '';
  var re = (tgt && tgt.closest) ? tgt.closest('a.re') : null;
  if (re){
    var rid = (re.getAttribute('href') || '').replace(/^#/, '');
    var rel = rid ? document.getElementById(rid) : null;
    if (rel && rel.scrollIntoView) { rel.scrollIntoView({block: 'start'}); lastHashScrolled = rid; }
    else missingRe = 'No.' + rid.replace(/^no-/, '');   // 提示在下面「已填充」之后补，避免被覆盖
  }
  // 点击任一条的标题条 → 自动填充回复表单（收件人=发言人；仅当该条带 Tag 时才一并填 Tag 与 Re:No，
  // 因为规则要求 Re 必须与 Tag 同行，否则不合规）
  // ⚠️ **抄送（Cc）故意不自动填**（2026-09-18 用户定）：抄送的用途是「周知」，属于发送者显式决定的事，
  // 由「回复某条」推断会把知会对象填错 —— 别把它当漏掉的实现去“补全”。
  var bt = (tgt && tgt.closest) ? tgt.closest('.blk-title') : null;
  if (bt){
    var s = bt.getAttribute('data-speaker');
    var st = bt.getAttribute('data-tag');
    var note = s ? t('fld.fillnote', s) : '';
    if (s) to.value = s;
    if (st){                                   // 有 Tag 才填 Tag + Re:No（输入框只填短名）
      session.value = bareTag(st);
      var sn = (bt.getAttribute('data-no') || '').replace(/^No\./, '');
      if (sn) reply.value = sn;
      note += (sn ? t('fld.fillreply', 'No.' + sn) : '') + t('fld.fillconvo', tagLabel(st));
    }
    createTag.checked = false;                 // 点标题 = 回复行为 ⇒ 退出创建态
    // 点到的这条**带 Tag** ⇒ 进入「回复它」，自动取消「不带Tag」；
    // 不带 Tag 的条只能填个收件人（没有对话可回）⇒ **保持「不带Tag」勾选不动**（2026-09-17 用户定）
    if (st) plainPost = false;
    syncPlainChk();
    syncTagInputs();
    // ⚠️ 这里**不能**把刚填的值写进 lastAuto*：applyDefault() 的判定是「值 == lastAuto* 就当成
    // 「还停在自动默认值」并覆盖为默认」，而填完的值恰好等于 lastAuto* ⇒ 下一次重绘（点徽标筛选、
    // 点刷新…）会把刚填的收件人 / ReNo **打回默认**（2026-09-17 实测：填 No.149 后重绘变回 No.150）。
    // lastAuto* 只应记录「自动填的默认值」，用户/点击填充的值与它不等才不会被覆盖。
    setHint(t('hi.filled', note || t('fld.none')), 'ok');
    // 「找不到被回应的编号」优先于「已填充」提示：目标可能在更早、未显示的归档里
    if (missingRe) setHint(t('hint.anchor.none', missingRe), 'err');
  }
});
// 失焦 / 变更时把误输入的 `Tag.` 前缀（或 `End:`）去掉，输入框始终保持「短名」
function normalizeTagInput(){ var b = bareTag(session.value); if (b !== session.value) session.value = b; }
session.addEventListener('input', warnTag);
session.addEventListener('blur', normalizeTagInput);
session.addEventListener('change', normalizeTagInput);
// ── UI 规则（2026-09-17 用户定）───────────────────────────────────────────────
//  · Tag / 回复No. 默认只读：值来自「点上一条发言的标题」或默认值（上一条发言的 Tag / No.）
//  · 「创建Tag」与「结束Tag」互斥，默认都不选
//  · 创建行为：勾选后 Tag 可编辑、回复No. 清空、必须带 Tag
//  · 结束行为：Tag 为空时提示点击发言标题，选择要结束的对话
function syncTagInputs(){
  session.readOnly = !createTag.checked;   // 只有「创建Tag」才能手填 Tag
  reply.readOnly = true;                   // 回复No. 始终只读（由点击标题/默认值填充）
}
createTag.addEventListener('change', function(){
  if (createTag.checked){ endTag.checked = false; reply.value = ''; }   // 互斥 + 清空回复No.
  plainPost = false; syncPlainChk();                                    // 与「不带Tag」互斥：创建 = 对话行为
  syncTagInputs(); warnTag();
});
endTag.addEventListener('change', function(){
  if (endTag.checked){ createTag.checked = false; }
  plainPost = false; syncPlainChk();                                    // 与「不带Tag」互斥：结束 = 对话行为
  syncTagInputs(); warnTag();
});
// 「不带Tag」勾选（默认选中，与「创建Tag」「结束Tag」同款样式、三态互斥）：
// 勾上 ⇒ 清空 Tag/ReNo（本条不带对话）；取消 ⇒ 回到缺省（回复上一条）
noTagBox.addEventListener('change', function(){
  if (noTagBox.checked){ setPlainPost(true); }
  else { plainPost = false; syncPlainChk(); applyDefault(allParsed()); warnTag(); }
});
syncPlainChk();

// 历史视图下拉：归档清单（后端按 k 降序 = 新→旧；空清单则禁用）
function renderArchives(list, cur){
  if (!histSel) return;
  var arr = list || [];
  var opts = ['<option value="">' + t('hist.latest') + '</option>'];
  arr.forEach(function(a){
    opts.push('<option value="' + esc(a.name) + '"' + (a.name === cur ? ' selected' : '') + '>' +
              esc(t('hist.opt', a.name, String(a.from), String(a.to))) + '</option>');
  });
  histSel.innerHTML = opts.join('');
  histSel.disabled = arr.length === 0;
}
if (histSel) histSel.addEventListener('change', function(){ load(histSel.value || ''); });
if (histBack) histBack.addEventListener('click', function(){ load(''); });

// load：默认读 CHAT.md；传 archiveName 则读该归档（历史视图，只读）
function load(archiveName){
  busy(true); setHint(t('hi.reading'),'spinner');
  var q = '/api/chat' + roomQuery() + (archiveName ? '&archive=' + encodeURIComponent(archiveName) : '');
  apiFetch(q).then(r=>r.json()).then(function(j){
    if(j.ok){
      renderRooms(j.rooms, j.room);
      // 免鉴权白名单聊天室：无登录概念，隐藏「登出」（有 token 进入时也隐藏，避免误导）
      if (logoutBtn) logoutBtn.style.display = (j.noauth) ? 'none' : '';
      renderArchives(j.archives, archiveName || '');
      show(j.content, t('hi.read', (j.room || ''), (j.repo || '')), (j.history && j.history.name) || '');
    }
    else setHint(j.error||t('err.readfail'),'err');
  }).catch(e=>{ if(e.message!=='unauthorized') setHint(t('err.reqfail')+e,'err'); }).finally(()=>busy(false));
}

function update(opts){
  var auto = !!(opts && opts.auto);   // 自动刷新：不闪烁按钮、不刷「正在 pull」提示、不打扰表单
  if(auto){ if(historyName) return; if(autoBusy) return; autoBusy = true; }   // 历史视图：暂停自动刷新，否则会被刷回最新
  else { busy(true); setHint(t('hi.pulling'),'spinner'); }
  return apiFetch('/api/chat/update' + roomQuery(), {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})
    .then(r=>r.json()).then(function(j){
      if(j.ok){
        renderRooms(j.rooms, j.room);
        if(auto){
          show(j.content, null);              // 静默换内容
          autoTs.textContent = new Date().toTimeString().slice(0,8);    // 上次自动刷新时间 HH:MM:SS
        } else {
          show(j.content, (j.note||t('hi.refreshed')));
        }
      }
      else setHint(j.error||t('err.updfail'),'err');
    }).catch(e=>{ if(e.message!=='unauthorized') setHint(t('err.reqfail')+e,'err'); })
      .finally(()=>{ if(auto) autoBusy = false; else busy(false); });
}

function speak(){
  var v = msg.value.trim();
  if(!v){ setHint(t('err.empty'),'err'); return; }
  if(!from.value.trim()){ setHint(t('err.speaker'),'err'); return; }
  var short = bareTag(session.value), tag = fullTag(session.value);   // 短名 / 内部规范 Tag.<短名>
  var p = allParsed(), isEnd = endTag.checked, isCreate = createTag.checked && !isEnd;
  if(!short && (isEnd || isCreate)){ setHint(t(isEnd ? 'warn.end.needtag' : 'warn.create.needtag'),'err'); return; }
  if(isEnd){
    var owner = tagOwner(p, tag);
    if(owner && owner !== selfSpeaker()){
      setHint(t('warn.end.notowner', tagLabel(tag), owner),'err'); return;
    }
  } else if(closedTags[tag]){
    setHint(t('warn.closed', tagLabel(tag)),'err'); return;
  }
  busy(true); setHint(t('hi.sending'),'spinner');
  apiFetch('/api/chat/speak' + roomQuery(), {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({content: v, from: from.value.trim(), to: to.value.trim(), cc: cc.value.trim(), subject: subject.value.trim(),
                              session: short ? ((isEnd ? 'EndTag:' : 'Tag:') + short) : '',
                              reply: short ? reply.value.trim() : '',
                              create: isCreate, lang: curLang()})})
    .then(r=>r.json()).then(function(j){
      if(j.ok){ histPush('to', to.value); histPush('cc', cc.value);   // 发言成功才记历史（先记后清空 cc）
                msg.value=''; reply.value=''; cc.value=''; endTag.checked=false; createTag.checked=false; plainPost=true; syncPlainChk(); syncTagInputs(); setHint(t('hi.sent'),'ok'); localStorage.setItem('chat_from', from.value.trim()); load(); }
      else setHint(j.error||t('err.speakfail'),'err');
    }).catch(e=>{ if(e.message!=='unauthorized') setHint(t('err.reqfail')+e,'err'); }).finally(()=>busy(false));
}

msg.addEventListener('keydown', function(e){ if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); speak(); } });
speakBtn.addEventListener('click', speak);
updateBtn.addEventListener('click', update);

// ---- 自动刷新（配置参数：AUTO_REFRESH_SEC —— 刷新间隔秒数）----
// AUTO_REFRESH_SEC：**> 0 = 间隔秒数（下限 5s，防误配成狂刷）；= 0（或负数）= 不自动刷新**（勾选框隐藏）。
// 取值来源：服务端按配置 ui.auto_refresh_sec 注入（见 main.go）；直接打开本文件时用默认 30。
// 勾选后每 N 秒拉一次最新发言；页面切到后台（document.hidden）自动暂停，回到前台补刷一次；勾选状态记在 localStorage。
var AUTO_REFRESH_SEC = (window.__AUTO_REFRESH_SEC__ != null) ? window.__AUTO_REFRESH_SEC__ : 30;
var AUTO_REFRESH_KEY = 'chat_autorefresh';
var autoTimer = null, autoBusy = false;
function autoRefreshEnabled(){ return Number(AUTO_REFRESH_SEC) > 0; }
function autoRefreshSec(){ return autoRefreshEnabled() ? Math.max(5, Math.floor(Number(AUTO_REFRESH_SEC))) : 0; }
function autoTick(){
  if(!autoRefreshEnabled() || !autoRefresh.checked || document.hidden || autoBusy) return;
  if(updateBtn.disabled) return;   // 手动刷新 / 发言进行中 ⇒ 跳过本轮，不叠加请求
  update({auto:true});
}
function syncAutoRefresh(){
  if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
  if(!autoRefreshEnabled() || !autoRefresh.checked) return;
  autoTimer = setInterval(autoTick, autoRefreshSec()*1000);
}
autoRefresh.addEventListener('change', function(){
  if(!autoRefreshEnabled()) return;
  try{ localStorage.setItem(AUTO_REFRESH_KEY, autoRefresh.checked ? '1' : '0'); }catch(e){}
  syncAutoRefresh();
  if(autoRefresh.checked) setHint(t('hi.autoon', autoRefreshSec()), 'ok');
  else { autoTs.textContent = ''; setHint(t('hi.autooff'), ''); }
});
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && autoRefresh.checked) autoTick();   // 回到前台补刷一次
});
if(!autoRefreshEnabled()){
  // ui.auto_refresh_sec = 0 ⇒ 不自动刷新：隐藏勾选框与时间戳，并忽略本地记忆
  autoRefreshLbl.style.display = 'none';
  autoTs.style.display = 'none';
  autoRefresh.checked = false;
} else {
  try{ autoRefresh.checked = localStorage.getItem(AUTO_REFRESH_KEY) === '1'; }catch(e){}
  syncAutoRefresh();
}

// ---- 移动端悬浮「↑ 写发言 / 回顶部」（≤640px 才显示；滚动 400px 后浮出）----
// 长页面在手机上滚过输入区后，一键回到顶部并直接开始写（点完聚焦正文框）。
// ⚠️ 与自动刷新是否开启无关（AUTO_REFRESH_SEC = 0 时这个按钮仍要能用）⇒ 放在顶层。
var toTop = document.getElementById('toTop');
function syncToTopBtn(){ if(toTop) toTop.classList.toggle('on', window.scrollY > 400); }
window.addEventListener('scroll', syncToTopBtn, {passive:true});
syncToTopBtn();
toTop.addEventListener('click', function(){
  window.scrollTo({top:0, behavior:'smooth'});
  // 等滚动到位再聚焦，否则 iOS 会先把键盘弹起、页面跳动
  setTimeout(function(){ try{ msg.focus({preventScroll:true}); }catch(e){ msg.focus(); } }, 320);
});

// 文件代理链接：浏览器对 <a> 导航不会附带 Authorization，直接点会 401。
// 故在此拦截点击，用已登录的 JWT 取回内容后于新标签页打开（兼容私有仓库）。
document.getElementById('box').addEventListener('click', function(e){
var a = e.target.closest && e.target.closest('a');
if(!a) return;
var href = a.getAttribute('href') || '';
if(href.indexOf('/api/chat/file/') !== 0) return;
e.preventDefault();
var ext = (href.split('?')[0].split('#')[0].split('.').pop() || '').toLowerCase();
// 文本 / 二进制判定：**默认按文本处理**（聊天室附件绝大多数是代码或文本），只显式列出二进制。
// 2026-09-16 修：原先只列了 8 种文本后缀，`.py`（demo）等会落到「原样 blob」分支 ——
// 新标签页拿到服务端给的 `text/x-python`（非标准类型、且 Chrome 会丢掉 charset 参数）
// ⇒ 浏览器按本地编码解码 UTF-8 中文 = **乱码**。现在文本类一律显式补 `charset=utf-8`。
var BIN_EXT = {png:1, jpg:1, jpeg:1, gif:1, webp:1, bmp:1, ico:1, pdf:1, zip:1, gz:1, tgz:1, tar:1,
               mp3:1, mp4:1, webm:1, wav:1, woff:1, woff2:1, ttf:1, otf:1, exe:1, bin:1, xlsx:1, docx:1};
var TEXT_TYPE = {json:'application/json', csv:'text/csv'};   // 其余文本一律 text/plain
// ⚠️ html / svg 也按 text/plain 呈现，**绝不**给 text/html —— blob 会继承本站 origin，
// 以 text/html 渲染等于让附件里的脚本在本站域下执行。
fetch(href, {headers: authHeaders()})
  .then(function(r){
    if(r.status === 401){ showLogin(t('login.expired')); throw new Error('unauthorized'); }
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.blob();
  })
  .then(function(b){
    var blob = BIN_EXT[ext] ? b : new Blob([b], {type: (TEXT_TYPE[ext] || 'text/plain') + ';charset=utf-8'});
    var url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  })
  .catch(function(err){ if(err.message !== 'unauthorized') alert(t('err.openfile') + err); });
});

// 启动：总是先尝试读取。白名单聊天室无需登录即可进入（此时不显示登出）；
// 需要鉴权且无（或失效）token 时 /api/chat 返回 401 → 自动弹登录门禁。
// URL 语言参数优先：?lang=en → 英文界面，?lang=zh-cn/zh → 中文界面，无参数沿用上次选择（默认中文）
(function () {
  var m = location.search.match(/[?&]lang=([^&#]+)/);
  if (!m) return;
  var lang = decodeURIComponent(m[1]).toLowerCase();
  if (lang === 'en') localStorage.setItem('chat_lang', 'en');
  else if (lang === 'zh-cn' || lang === 'zh') localStorage.setItem('chat_lang', 'zh');
})();
applyI18n();
load();
</script>
</body>
